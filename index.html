<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cyberpunk Roombox — AR</title>

  <!-- Ровно та же связка CDN, что в mindar_clean_test.html — она у тебя точно работает -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin:0; overflow:hidden; }
    #status {
      position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
      z-index:9999; padding:9px 14px; border-radius:12px;
      background:rgba(0,0,0,.58); color:#fff;
      font:14px Arial,sans-serif; text-align:center;
      pointer-events:none; max-width:90vw;
    }
  </style>
</head>

<body>
  <div id="status">Запускаю AR…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="10000">
      <img id="couplePhotoAsset" src="./couple_cutout.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="world" mindar-image-target="targetIndex: 0">

      <!-- Одна фотография поверх улицы румбокса -->
      <a-entity id="smoothWorld">
        <a-image
          id="couplePhoto"
          src="#couplePhotoAsset"
          position="0 -0.08 0.06"
          width="0.76"
          height="1.14"
          material="shader: flat; transparent: true; alphaTest: 0.01; side: double; depthWrite: false">
        </a-image>
      </a-entity>

    </a-entity>


  <script>
    const scene = document.querySelector('a-scene');
    const target = document.querySelector('[mindar-image-target]');
    const world = document.getElementById('world');
    const smoothWorld = document.getElementById('smoothWorld');
    const status = document.getElementById('status');

    let found = false;
    let lostTimer = null;

    scene.addEventListener('loaded', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
    scene.addEventListener('arReady', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });

    target.addEventListener('targetFound', () => {
      found = true;
      clearTimeout(lostTimer);
      smoothWorld.setAttribute('visible', true);
      status.textContent = 'Румбокс найден!';
    });

    target.addEventListener('targetLost', () => {
      found = false;
      clearTimeout(lostTimer);

      // Не скрываем сцену мгновенно: даём трекингу пережить короткий провал.
      lostTimer = setTimeout(() => {
        if (!found) smoothWorld.setAttribute('visible', false);
      }, 350);

      status.textContent = 'Наведи снова на румбокс.';
    });

    scene.addEventListener('arError', () => { status.textContent = 'Ошибка запуска AR.'; });

    // Лёгкое сглаживание масштаба/позиции самой визуальной сцены.
    // MindAR продолжает полностью управлять target entity.
    let lastScale = 1;
    function smoothTick() {
      if (found) {
        const s = world.object3D.scale;
        const current = (s.x + s.y + s.z) / 3;
        lastScale += (current - lastScale) * 0.18;
        smoothWorld.object3D.scale.setScalar(lastScale / Math.max(current, 0.0001));
      }
      requestAnimationFrame(smoothTick);
    }
    smoothTick();
  </script>
</body>
</html>
