<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cyberpunk Roombox — AR (anime)</title>

  <!-- та же связка CDN, что и раньше -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin:0; overflow:hidden; }
    #status {
      position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
      z-index:9999; padding:9px 14px; border-radius:12px;
      background:rgba(0,0,0,.58); color:#fff;
      font:14px Arial,sans-serif; text-align:center;
      pointer-events:none; max-width:90vw;
    }
  </style>
</head>

<body>
  <div id="status">Запускаю AR…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- =========================================================
         ОДНА ЦЕЛЬ — targets.mind пересобран под один кадр
         (1717×3260 px). Плоскость AR у MindAR всегда имеет
         width=1, height=(высота фото / ширина фото) = 1.899,
         центр в (0,0), ось Y вверх, ось X вправо.

         Позиции ниже посчитаны не "на глаз", а по красным
         обводкам на присланном фото — нашёл пиксельные центры
         обведённых зон и перевёл их в координаты плоскости:
           guy    (парень, низ у STOP/жёлтых коробок) → x≈-0.18  y≈-0.48
           couple (пара на мостках, под вывесками)    → x≈ 0.01  y≈ 0.09
           car    (тачка, парит низко над дорогой)    → x≈-0.04  y≈-0.42
         (для car x взят с поправкой: спрайт стал шире за счёт
         светового следа слева, поэтому центр плоскости сдвинут
         влево, чтобы сам корпус машины визуально оказался в
         точке x≈0.03).

         Это по-прежнему оценка по фото, а не калибровка вживую —
         возможно, понадобится подвинуть на пару сотых на реальном
         устройстве.
         ========================================================= -->

    <a-entity id="world0" mindar-image-target="targetIndex: 0">
      <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>

      <!-- парень внизу слева, у автомата / STOP -->
      <a-entity position="-0.18 -0.48 0.06"
        animation__breathe="property: scale; from: 0.99 0.99 1; to: 1.01 1.02 1; dur: 2400; easing: easeInOutSine; direction: alternate; loop: true"
        animation__sway="property: rotation; from: 0 0 -1.2; to: 0 0 1.2; dur: 3400; easing: easeInOutSine; direction: alternate; loop: true">
        <a-plane data-sprite="guy" width="0.171" height="0.30" material="shader: flat; transparent: true; opacity: 0"></a-plane>
        <a-circle radius="0.012" position="0.005 -0.005 0.002" material="shader: flat; color:#dfe6ef; transparent:true; opacity:.20"
          animation="property: position; from: 0.005 -0.005 0.002; to: 0.028 0.10 0.002; dur: 2600; easing: easeOutQuad; loop: true"
          animation__o="property: material.opacity; from: 0.26; to: 0; dur: 2600; easing: linear; loop: true"></a-circle>
        <a-circle radius="0.008" position="0.012 0.03 0.002" material="shader: flat; color:#dfe6ef; transparent:true; opacity:.14"
          animation="property: position; from: 0.012 0.03 0.002; to: 0.040 0.13 0.002; dur: 2600; delay: 900; easing: easeOutQuad; loop: true"
          animation__o="property: material.opacity; from: 0.18; to: 0; dur: 2600; delay: 900; easing: linear; loop: true"></a-circle>
      </a-entity>

      <!-- пара на мостках, ниже, чем было раньше -->
      <a-entity position="0.01 0.09 0.05"
        animation__breathe="property: scale; from: 0.99 0.99 1; to: 1.015 1.015 1; dur: 2800; easing: easeInOutSine; direction: alternate; loop: true">
        <a-plane data-sprite="couple" width="0.186" height="0.20" material="shader: flat; transparent: true; opacity: 0"></a-plane>
      </a-entity>

      <!-- ретро-тачка, парит низко над дорогой, со светящимся следом сзади -->
      <a-entity position="-0.04 -0.42 0.10"
        animation__bob="property: position; from: -0.04 -0.42 0.10; to: -0.04 -0.385 0.10; dur: 1900; easing: easeInOutSine; direction: alternate; loop: true"
        animation__tilt="property: rotation; from: 0 0 -1.2; to: 0 0 1.2; dur: 2600; easing: easeInOutSine; direction: alternate; loop: true">
        <a-plane data-sprite="car" width="0.422" height="0.15" material="shader: flat; transparent: true; opacity: 0"></a-plane>
      </a-entity>
    </a-entity>

  </a-scene>


  <script>
  /* ==========================================================================
     ВСЯ ГРАФИКА — ЗДЕСЬ. Это обычные SVG-картинки (2D, аниме-стиль),
     которые натягиваются текстурой на плоскости выше.
     Хочешь поменять цвет/деталь — правь SVG, никакой 3D-математики.
     ========================================================================== */

  const SPRITES = {};

  /* ---------------- ПАРЕНЬ В ХУДИ (320 x 560) ----------------
     Функция принимает blink: false = глаза открыты (светятся),
     true = глаза закрыты (моргание). Два кадра дают "живую" анимацию
     без всякой 3D-математики — просто смена картинки во времени. */
  function guySVG(blink){
  const guyEyes = blink
    ? `<path d="M130,151 C138,145 152,145 160,151" fill="none" stroke="#0a1018" stroke-width="5" stroke-linecap="round"/>
       <path d="M194,151 C188,145 176,145 168,151" fill="none" stroke="#0a1018" stroke-width="5" stroke-linecap="round"/>`
    : `<g filter="url(#fGlow)">
        <path d="M132,152 C138,140 152,138 158,150 C156,166 146,172 138,168 C131,164 129,158 132,152 Z" fill="#62f7ff"/>
        <path d="M196,152 C190,140 176,138 170,150 C172,166 182,172 190,168 C197,164 199,158 196,152 Z" fill="#62f7ff"/>
      </g>
      <circle cx="145" cy="150" r="3.5" fill="#ffffff"/>
      <circle cx="183" cy="150" r="3.5" fill="#ffffff"/>`;
  return `
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="560" viewBox="0 0 320 560">
  <defs>
    <linearGradient id="gHood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bf0ab"/><stop offset=".5" stop-color="#219a66"/><stop offset="1" stop-color="#0c4a31"/>
    </linearGradient>
    <linearGradient id="gHoodBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d7d52"/><stop offset="1" stop-color="#083221"/>
    </linearGradient>
    <linearGradient id="gPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3549"/><stop offset="1" stop-color="#10131b"/>
    </linearGradient>
    <linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdcbc"/><stop offset="1" stop-color="#d69873"/>
    </linearGradient>
    <filter id="fGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <g stroke="#0a1018" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- согнутая нога: стопа упирается в автомат -->
    <path d="M178,318 L220,316 C252,342 274,378 284,418 L246,438 C234,400 210,368 178,350 Z" fill="url(#gPants)"/>
    <path d="M284,418 L246,438 L256,486 L296,478 Z" fill="url(#gPants)"/>
    <path d="M242,478 L298,470 C314,468 318,484 308,494 L250,504 Z" fill="#1b202b"/>

    <!-- опорная нога -->
    <path d="M126,322 L178,322 L184,512 L132,512 Z" fill="url(#gPants)"/>
    <path d="M124,500 L186,500 L190,534 C190,544 182,548 170,548 L128,548 C116,548 112,540 114,532 Z" fill="#1b202b"/>

    <!-- капюшон сзади -->
    <ellipse cx="160" cy="146" rx="68" ry="78" fill="url(#gHoodBack)"/>

    <!-- худи -->
    <path d="M110,238 C110,210 132,196 160,196 C190,196 212,212 212,240 L220,326 C220,342 196,352 160,352 C124,352 100,342 102,326 Z" fill="url(#gHood)"/>

    <!-- левая рука, свисает -->
    <path d="M112,230 C94,264 88,302 90,338 L128,342 C128,302 132,264 144,238 Z" fill="url(#gHood)"/>
    <path d="M88,334 C104,330 120,336 120,350 C120,364 102,370 92,362 C84,356 82,342 88,334 Z" fill="url(#gSkin)"/>

    <!-- правая рука поднята ко рту -->
    <path d="M196,210 L226,206 C250,236 258,272 252,300 L214,298 C218,266 212,236 196,210 Z" fill="url(#gHood)"/>
    <path d="M214,298 L252,300 C242,254 222,218 200,196 L172,214 C192,238 208,264 214,298 Z" fill="url(#gHood)"/>
    <path d="M172,184 C190,176 208,186 206,202 C204,218 186,224 174,214 C164,206 164,190 172,184 Z" fill="url(#gSkin)"/>

    <!-- лицо -->
    <path d="M122,132 C122,100 140,84 162,84 C186,84 204,100 204,132 C204,162 190,186 162,198 C134,186 122,162 122,132 Z" fill="url(#gSkin)"/>

    <!-- чёлка -->
    <path d="M124,126 C126,96 142,80 162,80 C184,80 202,96 202,126 C194,112 180,120 166,110 C156,124 138,116 124,126 Z" fill="#1b2431"/>

    <!-- козырёк капюшона поверх лба -->
    <path d="M104,158 C96,96 124,58 162,58 C200,58 228,96 220,158 C204,126 188,112 162,112 C136,112 120,126 104,158 Z" fill="url(#gHood)"/>

    <!-- завязки -->
    <path d="M132,196 C128,224 130,244 134,258" fill="none" stroke-width="6"/>
    <path d="M190,196 C196,222 196,242 192,256" fill="none" stroke-width="6"/>

    <!-- карман-кенгуру -->
    <path d="M118,288 C140,306 182,306 204,288" fill="none" stroke-width="4"/>
  </g>

  <!-- тень от капюшона на лице -->
  <path d="M120,124 C140,114 184,114 204,124 L204,172 C182,182 140,182 120,172 Z" fill="#061019" opacity=".55"/>

  <!-- глаза: открыты или закрыты, зависит от кадра -->
  ${guyEyes}

  <!-- рот + сигарета -->
  <path d="M152,186 C158,190 166,190 172,186" fill="none" stroke="#7c3f34" stroke-width="4" stroke-linecap="round"/>
  <g transform="rotate(-22 168 190)">
    <rect x="128" y="184" width="46" height="9" rx="4.5" fill="#f1efe6" stroke="#0a1018" stroke-width="3"/>
    <rect x="120" y="183" width="12" height="11" rx="5" fill="#ff7a3c"/>
    <circle cx="126" cy="188" r="9" fill="#ff5a1e" filter="url(#fGlow)" opacity=".9"/>
  </g>

  <!-- неоновая подсветка контура: циан слева, магента справа -->
  <path d="M110,238 C110,210 132,196 160,196" fill="none" stroke="#3ef0ff" stroke-width="7" opacity=".8" filter="url(#fSoft)" stroke-linecap="round"/>
  <path d="M104,158 C98,104 122,66 158,60" fill="none" stroke="#3ef0ff" stroke-width="6" opacity=".7" filter="url(#fSoft)" stroke-linecap="round"/>
  <path d="M214,300 C250,300 258,262 244,224" fill="none" stroke="#ff4fd3" stroke-width="7" opacity=".75" filter="url(#fSoft)" stroke-linecap="round"/>
  <path d="M220,330 C222,300 218,262 212,240" fill="none" stroke="#ff4fd3" stroke-width="6" opacity=".6" filter="url(#fSoft)" stroke-linecap="round"/>

  <!-- неон на подошвах -->
  <path d="M118,540 H186" stroke="#3ef0ff" stroke-width="5" stroke-linecap="round" filter="url(#fSoft)"/>
  <path d="M248,498 L304,488" stroke="#3ef0ff" stroke-width="5" stroke-linecap="round" filter="url(#fSoft)"/>
</svg>`;
  }

  const FRAMES_GUY = [ guySVG(false), guySVG(true) ];

  /* ---------------- ПАРА В ОБНИМКУ (520 x 560) ----------------
     blink здесь моргают оба сразу — проще и всё равно смотрится живо. */
  function coupleSVG(blink){
  const guyInCoupleEyes = blink
    ? `<path d="M178,143 C184,138 194,138 200,143" fill="none" stroke="#1d2b44" stroke-width="4" stroke-linecap="round"/>
       <path d="M224,143 C218,138 208,138 202,143" fill="none" stroke="#1d2b44" stroke-width="4" stroke-linecap="round"/>`
    : `<path d="M176,142 C181,132 192,131 197,141 C195,155 187,160 181,157 C175,154 173,148 176,142 Z" fill="#1d2b44"/>
       <path d="M226,142 C221,132 210,131 205,141 C207,155 215,160 221,157 C227,154 229,148 226,142 Z" fill="#1d2b44"/>
       <circle cx="186" cy="141" r="3" fill="#7ef4ff"/><circle cx="216" cy="141" r="3" fill="#7ef4ff"/>`;
  const girlEyes = blink
    ? `<path d="M332,161 C338,155 348,155 354,161" fill="none" stroke="#6b1c4e" stroke-width="4" stroke-linecap="round"/>
       <path d="M372,161 C366,155 356,155 350,161" fill="none" stroke="#6b1c4e" stroke-width="4" stroke-linecap="round"/>`
    : `<path d="M330,160 C335,148 348,147 353,159 C351,175 342,181 335,177 C328,173 327,166 330,160 Z" fill="#6b1c4e"/>
       <path d="M374,160 C369,148 356,147 351,159 C353,175 362,181 369,177 C376,173 377,166 374,160 Z" fill="#6b1c4e"/>
       <circle cx="340" cy="158" r="3.5" fill="#ffd7f2"/><circle cx="364" cy="158" r="3.5" fill="#ffd7f2"/>`;
  return `
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560">
  <defs>
    <linearGradient id="cJacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4b6b"/><stop offset="1" stop-color="#151a28"/>
    </linearGradient>
    <linearGradient id="cCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6fae"/><stop offset="1" stop-color="#8e2352"/>
    </linearGradient>
    <linearGradient id="cHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3dd"/><stop offset="1" stop-color="#d0418f"/>
    </linearGradient>
    <linearGradient id="cSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdec2"/><stop offset="1" stop-color="#e0a880"/>
    </linearGradient>
    <linearGradient id="cPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3044"/><stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <filter id="cGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <g stroke="#0a1018" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== ПАРЕНЬ (слева) ===== -->
    <path d="M152,320 h40 l6,184 h-50 z" fill="url(#cPants)"/>
    <path d="M198,320 h40 l4,184 h-48 z" fill="url(#cPants)"/>
    <path d="M142,496 h56 l4,26 c0,8 -6,12 -16,12 h-38 c-10,0 -14,-6 -12,-14 z" fill="#1b202b"/>
    <path d="M192,496 h56 l4,26 c0,8 -6,12 -16,12 h-38 c-10,0 -14,-6 -12,-14 z" fill="#1b202b"/>

    <!-- куртка -->
    <path d="M144,214 C144,188 166,174 196,174 C226,174 248,190 248,216 L254,330 C232,344 158,344 140,330 Z" fill="url(#cJacket)"/>
    <path d="M196,178 L196,336" fill="none" stroke="#2df0ff" stroke-width="5" opacity=".9"/>

    <!-- его рука на плечах девушки -->
    <path d="M240,196 C286,178 348,182 384,200 L380,232 C344,214 284,210 244,226 Z" fill="url(#cJacket)"/>

    <!-- свободная рука -->
    <path d="M148,216 C132,252 128,292 132,326 L164,326 C162,290 166,250 176,222 Z" fill="url(#cJacket)"/>
    <path d="M130,320 C146,318 160,326 158,340 C156,354 138,358 130,348 C124,340 124,326 130,320 Z" fill="url(#cSkin)"/>

    <!-- его голова -->
    <path d="M162,128 C162,98 178,84 198,84 C220,84 236,98 236,128 C236,156 222,178 198,190 C174,178 162,156 162,128 Z" fill="url(#cSkin)"/>
    <path d="M160,126 C160,92 176,74 198,74 C222,74 240,92 238,128 C230,110 216,116 200,104 C186,120 172,112 160,126 Z" fill="#1c2b4a"/>
    <path d="M238,116 C250,96 244,74 228,66" fill="none" stroke="#1c2b4a" stroke-width="12"/>

    <!-- ===== ДЕВУШКА (справа) ===== -->
    <path d="M312,330 h34 l4,150 h-42 z" fill="#1c2030"/>
    <path d="M352,330 h34 l2,150 h-40 z" fill="#1c2030"/>
    <path d="M304,474 h48 l4,26 c0,8 -6,12 -16,12 h-32 c-10,0 -14,-6 -12,-14 z" fill="#2b1420"/>
    <path d="M350,474 h48 l4,26 c0,8 -6,12 -16,12 h-32 c-10,0 -14,-6 -12,-14 z" fill="#2b1420"/>

    <!-- юбка/пальто -->
    <path d="M304,300 L396,300 L410,364 C384,378 318,378 292,364 Z" fill="url(#cCoat)"/>
    <path d="M300,214 C300,190 322,176 350,176 C378,176 400,190 400,214 L404,308 C380,320 320,320 296,308 Z" fill="url(#cCoat)"/>

    <!-- её рука вокруг талии парня -->
    <path d="M302,262 C274,278 238,284 212,280 L214,310 C250,314 288,304 314,288 Z" fill="url(#cCoat)"/>

    <!-- свободная рука -->
    <path d="M396,216 C412,248 416,286 412,316 L382,316 C384,284 380,248 372,222 Z" fill="url(#cCoat)"/>
    <path d="M412,310 C428,308 440,316 438,330 C436,344 418,348 410,338 C404,330 406,316 412,310 Z" fill="url(#cSkin)"/>

    <!-- волосы сзади -->
    <path d="M296,150 C280,210 286,280 300,322 C326,332 376,332 402,322 C416,278 420,206 404,150 Z" fill="url(#cHair)"/>

    <!-- её голова -->
    <path d="M316,152 C316,124 330,110 350,110 C372,110 386,124 386,152 C386,180 372,200 350,212 C328,200 316,180 316,152 Z" fill="url(#cSkin)"/>
    <path d="M312,148 C312,112 330,96 350,96 C372,96 390,112 390,150 C382,130 366,138 352,124 C338,142 322,134 312,148 Z" fill="url(#cHair)"/>
  </g>

  <!-- лица: парень -->
  <g>
    ${guyInCoupleEyes}
    <path d="M188,172 C194,177 202,177 208,172" fill="none" stroke="#a45a4c" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="172" cy="162" rx="9" ry="5" fill="#ff9aa8" opacity=".5"/>
    <ellipse cx="226" cy="162" rx="9" ry="5" fill="#ff9aa8" opacity=".5"/>
  </g>

  <!-- лица: девушка -->
  <g>
    ${girlEyes}
    <path d="M344,190 C348,194 354,194 358,190" fill="none" stroke="#b05464" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="326" cy="178" rx="9" ry="5" fill="#ff8fb5" opacity=".55"/>
    <ellipse cx="378" cy="178" rx="9" ry="5" fill="#ff8fb5" opacity=".55"/>
  </g>

  <!-- маленькое голо-сердечко над парой -->
  <g filter="url(#cGlow)" opacity=".95">
    <path d="M268,58 C268,44 288,40 292,54 C296,40 316,44 316,58 C316,74 292,88 292,88 C292,88 268,74 268,58 Z" fill="#ff5fc4"/>
  </g>

  <!-- неоновые контурные блики -->
  <path d="M144,214 C144,188 166,174 196,174" fill="none" stroke="#2df0ff" stroke-width="7" opacity=".75" filter="url(#cSoft)" stroke-linecap="round"/>
  <path d="M400,214 L404,308" fill="none" stroke="#ff4fd3" stroke-width="7" opacity=".75" filter="url(#cSoft)" stroke-linecap="round"/>
  <path d="M296,150 C282,206 288,280 300,320" fill="none" stroke="#ff6fd8" stroke-width="5" opacity=".55" filter="url(#cSoft)"/>
</svg>`;
  }

  const FRAMES_COUPLE = [ coupleSVG(false), coupleSVG(true) ];

  /* ---------------- ЛЕТАЮЩАЯ РЕТРО-ТАЧКА (900 x 320) ----------------
     Раньше силуэт был круглый, "спейсшиповый" — читался как НЛО.
     Теперь профиль — плоский клин в духе классических спорткаров
     80-х: острый нос, покатое лобовое, прямая крыша, покатое
     заднее стекло, хромовая полоса по борту, всплывающие фары.
     Вместо огня из сопел — светящийся "временной" след позади
     (двойной росчерк + искры), как будто машина не сжигает
     топливо, а прошивает воздух светом. phase 0/1 просто чередуют
     яркость следа/фар/стоп-сигнала, чтобы всё "дышало".

     Холст стал шире (900 вместо 640) — левая треть ушла под сам
     след, поэтому корпус сдвинут в правую часть кадра; ширина
     плоскости-спрайта в сцене увеличена пропорционально (0.422). */
  function carSVG(phase){
    const glow     = phase === 0 ? 0.55 : 0.95;
    const headGlow = phase === 0 ? 4    : 6;
    const tailOp   = phase === 0 ? 1.0  : 0.35;
    const sparkOp  = phase === 0 ? 0.20 : 0.55;
  return `
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="vBody2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7edf5"/><stop offset=".45" stop-color="#9aa6bd"/><stop offset="1" stop-color="#4b5568"/>
    </linearGradient>
    <linearGradient id="vGlass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd8ec"/><stop offset="1" stop-color="#1c4356"/>
    </linearGradient>
    <linearGradient id="vTrail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="280" y2="0">
      <stop offset="0" stop-color="#8ff2ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#c9fbff" stop-opacity="${glow}"/>
    </linearGradient>
    <filter id="vGlow2" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vSoft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- световой след вместо выхлопа: отсвет на "дороге" + два росчерка + искры -->
  <ellipse cx="190" cy="228" rx="95" ry="14" fill="#8ff2ff" opacity="${glow*0.25}" filter="url(#vSoft2)"/>
  <path d="M0,140 C90,132 180,128 268,130" fill="none" stroke="url(#vTrail)" stroke-width="10" stroke-linecap="round" filter="url(#vGlow2)"/>
  <path d="M0,205 C90,210 180,208 268,196" fill="none" stroke="url(#vTrail)" stroke-width="6" stroke-linecap="round" filter="url(#vGlow2)"/>
  <ellipse cx="55"  cy="150" rx="9" ry="4" fill="#eafffe" opacity="${sparkOp}" filter="url(#vGlow2)"/>
  <ellipse cx="150" cy="206" rx="7" ry="3" fill="#eafffe" opacity="${sparkOp}" filter="url(#vGlow2)"/>
  <ellipse cx="215" cy="172" rx="6" ry="3" fill="#eafffe" opacity="${sparkOp}" filter="url(#vGlow2)"/>

  <!-- корпус: низкий клин -->
  <g stroke="#12151d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M870,190 L760,150 L660,95 L560,95 L460,150 L380,158 L350,158 L350,215 L870,215 Z" fill="url(#vBody2)"/>
    <!-- лобовое стекло -->
    <path d="M665,102 L755,148 L742,151 L652,106 Z" fill="url(#vGlass2)"/>
    <!-- заднее стекло -->
    <path d="M565,100 L468,148 L455,151 L562,104 Z" fill="url(#vGlass2)"/>
  </g>

  <!-- стойка двери -->
  <path d="M610,96 L604,158" stroke="#12151d" stroke-width="5" stroke-linecap="round"/>
  <!-- хромовая полоса по борту -->
  <path d="M380,176 C520,182 700,182 858,176" fill="none" stroke="#eef4fb" stroke-width="4" stroke-linecap="round" opacity=".6"/>

  <!-- парящие "подушки" под корпусом вместо колёс -->
  <ellipse cx="760" cy="223" rx="46" ry="9" fill="#7ef4ff" opacity="${glow}" filter="url(#vGlow2)"/>
  <ellipse cx="430" cy="223" rx="46" ry="9" fill="#7ef4ff" opacity="${glow}" filter="url(#vGlow2)"/>

  <!-- всплывающие фары -->
  <circle cx="838" cy="179" r="${headGlow}" fill="#fff6c4" filter="url(#vGlow2)"/>
  <circle cx="812" cy="186" r="${headGlow * 0.75}" fill="#fff6c4" filter="url(#vGlow2)"/>

  <!-- стоп-огонь, мигает -->
  <rect x="352" y="168" width="22" height="10" rx="4" fill="#ff3b3b" opacity="${tailOp}" filter="url(#vGlow2)"/>

  <!-- индикатор в салоне, для настроения -->
  <circle cx="600" cy="122" r="5" fill="#ffb454" opacity="${glow}" filter="url(#vGlow2)"/>

  <!-- номерной знак -->
  <g opacity=".9">
    <rect x="560" y="196" width="72" height="24" rx="5" fill="#0d1220" stroke="#7ef4ff" stroke-width="3"/>
    <text x="596" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8ef2ff">TC-88</text>
  </g>
</svg>`;
  }

  const FRAMES_CAR = [ carSVG(0), carSVG(1) ];

  const SPRITE_FRAMES = {
    guy:    FRAMES_GUY,
    couple: FRAMES_COUPLE,
    car:    FRAMES_CAR
  };

  /* ==========================================================================
     ФЛИПБУК-АНИМАЦИЯ: у каждого спрайта несколько кадров-SVG (см. выше).
     Каждый кадр один раз рисуется в canvas, дальше просто переключаем,
     какой canvas показан — это дёшево и работает на любом Android/iOS,
     в отличие от прямой SVG-текстуры (которая на части устройств
     превращается в чёрный прямоугольник).
     SS — множитель разрешения текстуры (2 = чётче, но тяжелее).
     ========================================================================== */
  const SS = 2;

  function toDataURI(svg){
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.trim());
  }

  function loadImage(svg){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = toDataURI(svg);
    });
  }

  // готовит canvas-текстуру для спрайта и возвращает контроллер
  // с методом setFrame(i) для переключения кадра
  async function setupSprite(el, svgFrames){
    const m = svgFrames[0].match(/width="(\d+)" height="(\d+)"/);
    const w = m ? +m[1] : 512, h = m ? +m[2] : 512;

    let images;
    try {
      images = await Promise.all(svgFrames.map(loadImage));
    } catch (e) {
      document.getElementById('status').textContent = 'Спрайт не загрузился: ' + el.dataset.sprite;
      return null;
    }

    const canvas = document.createElement('canvas');
    canvas.width  = w * SS;
    canvas.height = h * SS;
    const ctx = canvas.getContext('2d');

    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = 4;
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else tex.encoding = THREE.sRGBEncoding;

    function setFrame(i){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(images[i], 0, 0, canvas.width, canvas.height);
      tex.needsUpdate = true;
    }
    setFrame(0);

    const put = () => {
      const mesh = el.getObject3D('mesh');
      if (!mesh) { el.addEventListener('loaded', put, { once: true }); return; }
      mesh.material = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        alphaTest: 0.01,
        side: THREE.DoubleSide,
        toneMapped: false,
        depthWrite: false
      });
      mesh.material.needsUpdate = true;
    };
    put();

    return { setFrame, frameCount: images.length };
  }

  // случайное, "живое" моргание — не в такт, каждый персонаж моргает
  // в своём ритме, кадр закрытых глаз держится коротко
  function scheduleBlink(ctrl, minDelay, maxDelay){
    if (!ctrl) return;
    const wait = minDelay + Math.random() * (maxDelay - minDelay);
    setTimeout(() => {
      ctrl.setFrame(1);
      setTimeout(() => {
        ctrl.setFrame(0);
        scheduleBlink(ctrl, minDelay, maxDelay);
      }, 130);
    }, wait);
  }

  (async () => {
    // ВАЖНО: спрайты дублируются на каждую из 5 целей (по 3 плоскости на
    // каждую — guy/couple/car), т.е. всего по 5 штук каждого типа.
    // Раньше querySelectorAll(...).forEach(el => els[name] = el) затирал
    // предыдущие элементы и текстуру получала только последняя плоскость
    // (цель №4) — остальные 4 цели оставались с opacity:0, т.е. "невидимками".
    // Теперь заводим текстуру КАЖДОЙ плоскости отдельно, группируя только
    // сами промисы для параллельной загрузки.
    const groups = { guy: [], couple: [], car: [] };
    document.querySelectorAll('[data-sprite]').forEach(el => {
      groups[el.dataset.sprite].push(el);
    });

    async function setupGroup(elList, frames, blinkRange){
      const ctrls = await Promise.all(elList.map(el => setupSprite(el, frames)));
      if (blinkRange) {
        ctrls.forEach(ctrl => scheduleBlink(ctrl, blinkRange[0], blinkRange[1]));
      }
      return ctrls;
    }

    const [, , carCtrls] = await Promise.all([
      setupGroup(groups.guy,    SPRITE_FRAMES.guy,    [2200, 4200]),
      setupGroup(groups.couple, SPRITE_FRAMES.couple, [2600, 4800]),
      setupGroup(groups.car,    SPRITE_FRAMES.car,    null)
    ]);

    // машина не моргает — у каждой копии свой ровный "бегущий" цикл подсветки
    carCtrls.forEach(carCtrl => {
      if (!carCtrl) return;
      let phase = 0;
      setInterval(() => { phase = 1 - phase; carCtrl.setFrame(phase); }, 550);
    });
  })();

  /* ---------- статус AR ---------- */
  const scene   = document.querySelector('a-scene');
  const targets = document.querySelectorAll('[mindar-image-target]'); // все 5 целей, не только первая
  const status  = document.getElementById('status');

  scene.addEventListener('loaded',  () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
  scene.addEventListener('arReady', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
  scene.addEventListener('arError', () => { status.textContent = 'Ошибка запуска AR.'; });

  targets.forEach(target => {
    target.addEventListener('targetFound', () => { status.textContent = 'Румбокс найден!'; });
    target.addEventListener('targetLost',  () => { status.textContent = 'Наведи снова на румбокс.'; });
  });
  </script>
</body>
</html>
