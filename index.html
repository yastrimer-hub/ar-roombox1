<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Roombox — Cyberpunk AR Test</title>

  <!-- РОВНО ТА ЖЕ БАЗА, ЧТО У ТЕБЯ УЖЕ ЗАРАБОТАЛА -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 9px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.58);
      color: white;
      font: 14px Arial, sans-serif;
      text-align: center;
      pointer-events: none;
      max-width: 90vw;
    }
  </style>
</head>

<body>
  <div id="status">Запускаю AR…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="world" mindar-image-target="targetIndex: 0">

      <!-- =========================================================
           ТЕСТ №1
           ЧЕЛОВЕК ЖЁСТКО ПРИВЯЗАН К ЖЁЛТОМУ АВТОМАТУ.

           Координаты подобраны под новый вертикальный target.
           Не двигаем его программно вообще.
           ========================================================= -->

      <a-entity id="smoker"
        position="-0.31 -0.53 0.055"
        rotation="0 0 0"
        scale="0.58 0.58 0.58">

        <!-- корпус, чуть откинут назад -->
        <a-cylinder
          position="0 0.28 0"
          radius="0.075"
          height="0.25"
          rotation="0 0 -7"
          color="#30343d"
          material="shader: standard; roughness: .62">
        </a-cylinder>

        <!-- голова -->
        <a-sphere
          position="0.025 0.48 0"
          radius="0.065"
          color="#c88e6d"
          material="shader: standard; roughness: .68">
        </a-sphere>

        <!-- волосы -->
        <a-sphere
          position="0.025 0.515 -0.015"
          radius="0.064"
          color="#202329"
          material="shader: standard; roughness: .83">
        </a-sphere>

        <!-- опорная нога -->
        <a-cylinder
          position="-0.035 0.08 0"
          radius="0.028"
          height="0.28"
          rotation="0 0 -2"
          color="#20242c"
          material="shader: standard; roughness: .72">
        </a-cylinder>

        <!-- вторая нога согнута и поставлена на жёлтый автомат -->
        <a-entity
          position="0.00 0.14 0"
          rotation="0 0 -54">

          <a-cylinder
            position="0 -0.105 0"
            radius="0.028"
            height="0.23"
            color="#20242c"
            material="shader: standard; roughness: .72">
          </a-cylinder>

          <!-- ботинок -->
          <a-box
            position="0 -0.225 0.015"
            width="0.105"
            height="0.055"
            depth="0.065"
            color="#111318"
            material="shader: standard; roughness: .8">
          </a-box>
        </a-entity>

        <!-- левая рука свисает -->
        <a-cylinder
          position="-0.09 0.28 0"
          radius="0.021"
          height="0.18"
          rotation="0 0 -15"
          color="#c88e6d">
        </a-cylinder>

        <!-- правая рука поднята ко рту -->
        <a-entity
          position="0.09 0.34 0"
          rotation="0 0 -42">

          <a-cylinder
            position="0 -0.075 0"
            radius="0.021"
            height="0.17"
            color="#c88e6d">
          </a-cylinder>

          <!-- сигарета -->
          <a-cylinder
            position="0 -0.168 0.015"
            radius="0.008"
            height="0.075"
            rotation="0 0 90"
            color="#d8d8d8"
            material="shader: flat">
          </a-cylinder>

          <!-- горящий кончик -->
          <a-sphere
            position="0.041 -0.168 0.015"
            radius="0.010"
            color="#ff6a2a"
            material="shader: standard; emissive: #ff4d18; emissiveIntensity: 3">
          </a-sphere>
        </a-entity>

        <!-- лёгкий дым -->
        <a-sphere
          position="0.145 0.47 0.015"
          radius="0.025"
          color="#d9d9df"
          material="shader: standard; transparent: true; opacity: .22"
          animation="property: position; from: 0.145 0.47 0.015; to: 0.18 0.62 0.015; dur: 1800; easing: easeOutQuad; loop: true">
        </a-sphere>

        <a-sphere
          position="0.17 0.55 0.015"
          radius="0.018"
          color="#d9d9df"
          material="shader: standard; transparent: true; opacity: .14"
          animation="property: position; from: 0.17 0.55 0.015; to: 0.21 0.69 0.015; dur: 1800; delay: 450; easing: easeOutQuad; loop: true">
        </a-sphere>

      </a-entity>


      <!-- =========================================================
           ТЕСТ №2
           ЛЕТАЮЩАЯ КИБЕРПАНК-МАШИНА.
           БЕЗ КОЛЁС. ТОЖЕ ФИКСИРОВАНА.

           Она расположена чуть выше и правее центра улицы.
           Есть только маленькое зависание вверх/вниз.
           ========================================================= -->

      <a-entity id="hoverCar"
        position="0.13 0.05 0.18"
        rotation="0 0 0"
        scale="0.52 0.52 0.52"
        animation="
          property: position;
          from: 0.13 0.05 0.18;
          to: 0.13 0.09 0.18;
          dur: 1700;
          easing: easeInOutSine;
          direction: alternate;
          loop: true">

        <!-- основной корпус -->
        <a-box
          position="0 0 0"
          width="0.48"
          height="0.12"
          depth="0.26"
          color="#242833"
          material="shader: standard; metalness: .75; roughness: .22">
        </a-box>

        <!-- верхняя кабина -->
        <a-box
          position="0 0.10 -0.02"
          width="0.25"
          height="0.12"
          depth="0.17"
          color="#151922"
          material="shader: standard; metalness: .18; roughness: .18">
        </a-box>

        <!-- стекло -->
        <a-box
          position="0 0.105 0.07"
          width="0.20"
          height="0.06"
          depth="0.012"
          color="#55d9f2"
          material="shader: standard; transparent: true; opacity: .68; emissive: #135c70; emissiveIntensity: .8">
        </a-box>

        <!-- боковые двигатели -->
        <a-cylinder
          position="-0.22 -0.055 0"
          radius="0.06"
          height="0.05"
          rotation="90 0 0"
          color="#171a21"
          material="shader: standard; metalness: .8; roughness: .3">
        </a-cylinder>

        <a-cylinder
          position="0.22 -0.055 0"
          radius="0.06"
          height="0.05"
          rotation="90 0 0"
          color="#171a21"
          material="shader: standard; metalness: .8; roughness: .3">
        </a-cylinder>

        <!-- неоновые гондолы -->
        <a-box
          position="-0.23 0.02 0.08"
          width="0.04"
          height="0.025"
          depth="0.10"
          color="#48e9ff"
          material="shader: standard; emissive: #28e5ff; emissiveIntensity: 3">
        </a-box>

        <a-box
          position="0.23 0.02 0.08"
          width="0.04"
          height="0.025"
          depth="0.10"
          color="#ff4dcf"
          material="shader: standard; emissive: #ff2fc1; emissiveIntensity: 3">
        </a-box>

        <!-- голубые сопла -->
        <a-cone
          position="-0.16 -0.075 -0.15"
          radius-bottom="0.032"
          radius-top="0.006"
          height="0.11"
          rotation="180 0 0"
          color="#39dfff"
          material="shader: standard; emissive: #22dfff; emissiveIntensity: 3">
        </a-cone>

        <a-cone
          position="0.16 -0.075 -0.15"
          radius-bottom="0.032"
          radius-top="0.006"
          height="0.11"
          rotation="180 0 0"
          color="#ff50d1"
          material="shader: standard; emissive: #ff32c7; emissiveIntensity: 3">
        </a-cone>

        <!-- фары -->
        <a-sphere
          position="-0.13 0.015 0.145"
          radius="0.022"
          color="#fff3b0"
          material="shader: standard; emissive: #ffe67d; emissiveIntensity: 4">
        </a-sphere>

        <a-sphere
          position="0.13 0.015 0.145"
          radius="0.022"
          color="#fff3b0"
          material="shader: standard; emissive: #ffe67d; emissiveIntensity: 4">
        </a-sphere>

      </a-entity>


      <!-- =========================================================
           НЕОНОВАЯ ПОДСВЕТКА ДЛЯ ПОНИМАНИЯ МАСШТАБА/УГЛА.
           Это статичные тонкие 3D-объекты.
           ========================================================= -->

      <a-box
        position="-0.05 0.06 0.03"
        width="0.38"
        height="0.018"
        depth="0.018"
        color="#44dfff"
        material="shader: standard; emissive:#2edfff; emissiveIntensity:2">
      </a-box>

      <a-box
        position="0.18 -0.12 0.03"
        width="0.22"
        height="0.018"
        depth="0.018"
        color="#ff4dce"
        material="shader: standard; emissive:#ff2fc3; emissiveIntensity:2">
      </a-box>

    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const target = document.querySelector('[mindar-image-target]');
    const status = document.getElementById('status');

    scene.addEventListener('loaded', () => {
      status.textContent = 'Камера запущена. Наведи на румбокс.';
    });

    scene.addEventListener('arReady', () => {
      status.textContent = 'Камера запущена. Наведи на румбокс.';
    });

    target.addEventListener('targetFound', () => {
      status.textContent = 'Румбокс найден — смотри на положение 3D-объектов.';
    });

    target.addEventListener('targetLost', () => {
      status.textContent = 'Наведи снова на румбокс.';
    });

    scene.addEventListener('arError', () => {
      status.textContent = 'Ошибка запуска AR.';
    });
  </script>
</body>
</html>
