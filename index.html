<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Future World — AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    a-scene { width: 100vw; height: 100vh; }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #dffcff;
      background:
        radial-gradient(circle at 50% 35%, rgba(0,255,255,.12), transparent 36%),
        linear-gradient(#04070d, #000);
    }

    #start .box {
      max-width: 420px;
      padding: 26px 22px;
      border: 1px solid rgba(90,245,255,.55);
      border-radius: 18px;
      background: rgba(3,10,18,.82);
      box-shadow: 0 0 32px rgba(0,240,255,.12);
    }

    #start h1 {
      margin: 0 0 10px;
      font-size: 25px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #start p {
      margin: 0;
      line-height: 1.45;
      color: rgba(230,250,255,.82);
    }

    #start button {
      margin-top: 20px;
      min-width: 210px;
      padding: 14px 20px;
      border: 1px solid #43efff;
      border-radius: 12px;
      background: rgba(0,255,255,.06);
      color: #6ff6ff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 9000;
      max-width: 92vw;
      padding: 9px 13px;
      border: 1px solid rgba(120,245,255,.25);
      border-radius: 12px;
      background: rgba(0,0,0,.58);
      color: #fff;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(5px);
    }

    #calibration {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9001;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.38);
      color: rgba(255,255,255,.55);
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="start">
    <div class="box">
      <h1>Future World</h1>
      <p>Нажми кнопку, разреши камеру и наведи её прямо на всю переднюю часть румбокса.</p>
      <button id="startBtn">ЗАПУСТИТЬ КАМЕРУ</button>
    </div>
  </div>

  <div id="status">Подготовка AR…</div>
  <div id="calibration">target: 0 · maxTrack: 1</div>

  <a-scene
    id="scene"
    embedded
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
      maxTrack: 1;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      warmupTolerance: 5;
      missTolerance: 8;
    "
    color-space="sRGB"
    renderer="colorManagement:true; physicallyCorrectLights:true"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false">

    <a-assets>
      <img id="personSvg" alt="">
      <img id="coupleSvg" alt="">
      <img id="carSvg" alt="">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- ОДНА ЦЕЛЬ: полный фасад с фотографии -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <a-light type="ambient" color="#bfefff" intensity="0.75"></a-light>

      <!--
        Координаты привязаны к фотографии:
        x = влево/вправо от центра цели
        y = вверх/вниз от центра цели
        z = поверх плоскости маркера
      -->

      <!-- Неоновая подсветка верхней части -->
      <a-entity id="topGlow" position="0 0.40 0.035" scale="0.95 0.95 1">
        <a-ring radius-inner="0.28" radius-outer="0.285"
                rotation="0 0 0"
                material="shader:flat; color:#25e7ff; opacity:.18; transparent:true"
                animation="property:rotation; to:0 0 360; dur:9000; easing:linear; loop:true">
        </a-ring>
        <a-ring radius-inner="0.34" radius-outer="0.345"
                material="shader:flat; color:#ff4fd8; opacity:.10; transparent:true"
                animation="property:rotation; to:0 0 -360; dur:13000; easing:linear; loop:true">
        </a-ring>
      </a-entity>

      <!-- ПАРЕНЬ: нижняя левая часть улицы -->
      <a-entity
        position="-0.18 -0.12 0.08"
        scale="0.18 0.18 0.18"
        animation__float="property:position; from:-0.18 -0.12 0.08; to:-0.18 -0.095 0.08; dur:2200; easing:easeInOutSine; direction:alternate; loop:true"
        animation__sway="property:rotation; from:0 0 -1.2; to:0 0 1.2; dur:3600; easing:easeInOutSine; direction:alternate; loop:true">
        <a-plane id="personPlane"
                 width="1"
                 height="1.75"
                 material="shader:flat; transparent:true; opacity:1"
                 look-at="[camera]">
        </a-plane>
      </a-entity>

      <!-- ПАРА: центральная зона мостков -->
      <a-entity
        position="0.015 0.08 0.07"
        scale="0.13 0.13 0.13"
        animation="property:position; from:0.015 0.08 0.07; to:0.015 0.095 0.07; dur:2700; easing:easeInOutSine; direction:alternate; loop:true">
        <a-plane id="couplePlane"
                 width="1"
                 height="1.08"
                 material="shader:flat; transparent:true; opacity:1"
                 look-at="[camera]">
        </a-plane>
      </a-entity>

      <!-- ЛЕТАЮЩАЯ МАШИНА: низ дороги -->
      <a-entity
        position="-0.03 -0.23 0.10"
        scale="0.22 0.22 0.22"
        animation="property:position; from:-0.03 -0.23 0.10; to:0.04 -0.205 0.10; dur:4200; easing:easeInOutSine; direction:alternate; loop:true">
        <a-plane id="carPlane"
                 width="1.45"
                 height="0.52"
                 material="shader:flat; transparent:true; opacity:1"
                 look-at="[camera]">
        </a-plane>
      </a-entity>

      <!-- Три световые точки над улицей -->
      <a-sphere position="-0.31 0.02 0.06" radius="0.015"
                material="shader:standard; color:#65f4ff; emissive:#65f4ff; emissiveIntensity:4"
                animation="property:material.emissiveIntensity; from:1.2; to:4.5; dur:750; easing:easeInOutSine; direction:alternate; loop:true">
      </a-sphere>

      <a-sphere position="0 0.25 0.06" radius="0.015"
                material="shader:standard; color:#ff5fd5; emissive:#ff5fd5; emissiveIntensity:3"
                animation="property:material.emissiveIntensity; from:.8; to:3.8; dur:920; easing:easeInOutSine; direction:alternate; loop:true">
      </a-sphere>

      <a-sphere position="0.30 0.02 0.06" radius="0.015"
                material="shader:standard; color:#65f4ff; emissive:#65f4ff; emissiveIntensity:4"
                animation="property:material.emissiveIntensity; from:1; to:4.2; dur:680; easing:easeInOutSine; direction:alternate; loop:true">
      </a-sphere>

    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#scene');
    const start = document.querySelector('#start');
    const startBtn = document.querySelector('#startBtn');
    const status = document.querySelector('#status');
    const target = document.querySelector('#target');

    function svgData(svg) {
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    const person = `
      <svg xmlns="http://www.w3.org/2000/svg" width="320" height="560" viewBox="0 0 320 560">
        <defs>
          <linearGradient id="j" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#52f4ff"/><stop offset=".55" stop-color="#138f68"/><stop offset="1" stop-color="#082c25"/>
          </linearGradient>
          <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe0c4"/><stop offset="1" stop-color="#c78668"/>
          </linearGradient>
          <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g stroke="#08131b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M128 318 L178 318 L184 510 L132 510 Z" fill="#17212d"/>
          <path d="M178 318 L220 316 C250 345 270 378 282 420 L246 437 C230 398 206 364 178 348 Z" fill="#17212d"/>
          <path d="M125 500 H188 L191 535 Q184 550 162 548 H128 Q113 542 115 530 Z" fill="#0e151d"/>
          <path d="M244 476 H298 Q313 472 308 490 L251 503 Z" fill="#0e151d"/>
          <path d="M108 232 Q130 196 160 196 Q192 196 214 234 L220 326 Q194 348 160 348 Q124 348 102 326 Z" fill="url(#j)"/>
          <path d="M110 236 Q92 270 90 338 L128 342 Q128 304 144 240 Z" fill="url(#j)"/>
          <circle cx="105" cy="347" r="18" fill="url(#s)"/>
          <path d="M195 208 L225 205 Q252 240 250 301 L214 298 Q218 266 195 208 Z" fill="url(#j)"/>
          <circle cx="185" cy="201" r="18" fill="url(#s)"/>
          <ellipse cx="160" cy="140" rx="69" ry="79" fill="#0c4a34"/>
          <path d="M122 130 Q122 84 162 84 Q204 84 204 130 Q202 166 162 198 Q124 166 122 130 Z" fill="url(#s)"/>
          <path d="M104 158 Q97 99 128 64 Q160 48 195 70 Q223 102 219 158 Q201 126 162 112 Q126 125 104 158 Z" fill="url(#j)"/>
          <path d="M152 188 Q160 192 170 188" fill="none" stroke="#743e35" stroke-width="4"/>
        </g>
        <path d="M109 236 Q130 204 160 200" fill="none" stroke="#58f2ff" stroke-width="10" opacity=".75" filter="url(#g)"/>
        <path d="M105 158 Q99 105 133 68" fill="none" stroke="#58f2ff" stroke-width="8" opacity=".75" filter="url(#g)"/>
        <path d="M214 299 Q250 299 249 244" fill="none" stroke="#ff4fd5" stroke-width="10" opacity=".75" filter="url(#g)"/>
        <circle cx="145" cy="150" r="6" fill="#7ef4ff" filter="url(#g)"/>
        <circle cx="181" cy="150" r="6" fill="#7ef4ff" filter="url(#g)"/>
        <path d="M116 540 H188" stroke="#4bf3ff" stroke-width="7" filter="url(#g)"/>
      </svg>`;

    const couple = `
      <svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560">
        <defs>
          <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#53617f"/><stop offset="1" stop-color="#171c2b"/>
          </linearGradient>
          <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff75b8"/><stop offset="1" stop-color="#7e2451"/>
          </linearGradient>
          <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g stroke="#08131b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M150 326 H195 L199 505 H151 Z" fill="#20283a"/>
          <path d="M196 326 H239 L241 505 H195 Z" fill="#20283a"/>
          <path d="M300 330 H346 L350 480 H304 Z" fill="#1c2030"/>
          <path d="M349 330 H390 L392 480 H351 Z" fill="#1c2030"/>
          <path d="M140 300 Q156 176 198 176 Q240 176 254 222 L254 330 Q198 350 140 330 Z" fill="url(#a)"/>
          <path d="M302 212 Q320 175 350 176 Q380 176 401 214 L405 310 Q350 324 297 310 Z" fill="url(#b)"/>
          <path d="M156 146 Q156 94 198 94 Q240 94 240 146 Q236 182 198 204 Q160 182 156 146 Z" fill="#efbd99"/>
          <path d="M314 151 Q314 106 350 106 Q387 106 389 151 Q383 190 350 210 Q318 190 314 151 Z" fill="#f0c3a3"/>
          <path d="M153 145 Q155 88 205 78 Q245 92 240 140 Q222 112 198 112 Q174 130 153 145 Z" fill="#1e2d45"/>
          <path d="M311 148 Q315 91 356 93 Q394 104 390 148 Q372 126 349 127 Q331 138 311 148 Z" fill="#d84e93"/>
          <path d="M243 214 Q294 188 329 215 L319 243 Q285 226 245 246 Z" fill="url(#a)"/>
          <path d="M305 264 Q270 280 226 280" fill="none" stroke="#ff6ec0" stroke-width="5"/>
        </g>
        <path d="M143 214 Q164 181 195 179" fill="none" stroke="#52efff" stroke-width="9" opacity=".7" filter="url(#g)"/>
        <path d="M400 214 L404 308" fill="none" stroke="#ff52d5" stroke-width="9" opacity=".72" filter="url(#g)"/>
        <circle cx="186" cy="145" r="5" fill="#7ef4ff" filter="url(#g)"/>
        <circle cx="216" cy="145" r="5" fill="#7ef4ff" filter="url(#g)"/>
        <circle cx="340" cy="160" r="5" fill="#ffd2f0" filter="url(#g)"/>
        <circle cx="364" cy="160" r="5" fill="#ffd2f0" filter="url(#g)"/>
        <path d="M270 54 C270 40 291 40 294 54 C298 40 319 40 319 55 C319 72 294 90 294 90 Q270 72 270 54 Z"
              fill="#ff62ce" filter="url(#g)"/>
      </svg>`;

    const car = `
      <svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eef4fb"/><stop offset=".5" stop-color="#9ba8bb"/><stop offset="1" stop-color="#485469"/>
          </linearGradient>
          <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M0 142 C90 132 180 130 275 132" fill="none" stroke="#b9fbff" stroke-width="12" opacity=".42" filter="url(#g)"/>
        <path d="M0 205 C95 210 180 208 276 196" fill="none" stroke="#b9fbff" stroke-width="7" opacity=".56" filter="url(#g)"/>
        <g stroke="#111722" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M870 190 L760 150 L660 96 L560 96 L460 150 L380 158 L350 158 L350 215 H870 Z" fill="url(#body)"/>
          <path d="M665 102 L755 148 L742 151 L652 106 Z" fill="#27556d"/>
          <path d="M565 100 L468 148 L455 151 L562 104 Z" fill="#29495a"/>
        </g>
        <path d="M380 176 C520 182 700 182 858 176" fill="none" stroke="#f6fbff" stroke-width="4" opacity=".65"/>
        <ellipse cx="760" cy="223" rx="46" ry="9" fill="#7ef4ff" opacity=".85" filter="url(#g)"/>
        <ellipse cx="430" cy="223" rx="46" ry="9" fill="#7ef4ff" opacity=".85" filter="url(#g)"/>
        <circle cx="838" cy="179" r="10" fill="#fff7c5" filter="url(#g)"/>
        <circle cx="812" cy="186" r="8" fill="#fff7c5" filter="url(#g)"/>
        <rect x="352" y="168" width="22" height="10" rx="4" fill="#ff3348" filter="url(#g)"/>
        <rect x="560" y="196" width="72" height="24" rx="5" fill="#0d1220" stroke="#7ef4ff" stroke-width="3"/>
        <text x="596" y="213" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#8ef2ff">TC-88</text>
      </svg>`;

    function makeTexture(svg) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth * 2;
          canvas.height = img.naturalHeight * 2;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.needsUpdate = true;
          resolve(texture);
        };
        img.onerror = reject;
        img.src = svgData(svg);
      });
    }

    async function applyTexture(selector, svg) {
      const el = document.querySelector(selector);
      const texture = await makeTexture(svg);
      const mesh = el.getObject3D('mesh');
      if (!mesh) {
        el.addEventListener('loaded', () => applyTexture(selector, svg), { once:true });
        return;
      }
      mesh.material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        alphaTest: 0.01,
        side: THREE.DoubleSide,
        depthWrite: false,
        toneMapped: false
      });
      mesh.material.needsUpdate = true;
    }

    startBtn.addEventListener('click', async () => {
      start.style.display = 'none';
      status.textContent = 'Запускаю камеру…';

      try {
        await applyTexture('#personPlane', person);
        await applyTexture('#couplePlane', couple);
        await applyTexture('#carPlane', car);

        scene.components['mindar-image'].start();
      } catch (e) {
        console.error(e);
        status.textContent = 'Не удалось подготовить AR-графику.';
      }
    });

    scene.addEventListener('loaded', () => {
      status.textContent = 'Нажми «Запустить камеру».';
    });

    scene.addEventListener('arReady', () => {
      status.textContent = 'Камера готова — наведи на весь фасад.';
    });

    scene.addEventListener('arError', () => {
      status.textContent = 'Ошибка камеры или AR.';
    });

    target.addEventListener('targetFound', () => {
      status.textContent = 'Фасад найден — AR запущен!';
    });

    target.addEventListener('targetLost', () => {
      status.textContent = 'Фасад потерян — верни его целиком в кадр.';
    });
  </script>
</body>
</html>
