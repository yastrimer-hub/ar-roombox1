<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roombox AR</title>

  <!-- Загружаем библиотеки сразу, до создания AR-сцены. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    /* Убираем кнопку VR, которую нам здесь не нужно показывать. */
    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    /* Не накладываем собственный чёрный фон поверх камеры MindAR. */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    #startScreen {
      position: fixed;
      z-index: 100000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      box-sizing: border-box;
      padding: 24px;
      text-align: center;
      background: #0a0a12;
      color: #fff;
    }

    #startScreen p {
      max-width: 340px;
      line-height: 1.5;
      margin: 0;
      color: #fff;
    }

    #startButton {
      margin-top: 22px;
      padding: 14px 28px;
      border: 2px solid #00ffff;
      border-radius: 10px;
      background: transparent;
      color: #00ffff;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      position: fixed;
      z-index: 100001;
      left: 12px;
      right: 12px;
      bottom: 14px;
      padding: 8px 10px;
      box-sizing: border-box;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 0 5px #000;
      pointer-events: none;
    }

    #error {
      display: none;
      position: fixed;
      z-index: 100002;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: rgba(0,0,0,.85);
      color: #fff;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="startScreen">
    <p>Наведите камеру на фасад румбокса.<br>Разрешите доступ к камере, затем наведите телефон на изображение.</p>
    <button id="startButton">Запустить камеру</button>
  </div>

  <div id="status">AR ожидает запуска</div>
  <div id="error"></div>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes; uiError: yes; missTolerance: 5; filterMinCF: 0.001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="car" src="./assets/car.svg" crossorigin="anonymous">
      <img id="person1" src="./assets/person.svg" crossorigin="anonymous">
      <img id="person2" src="./assets/person.svg" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Машина -->
      <a-image
        id="carEntity"
        src="#car"
        position="-0.45 -0.35 0.02"
        rotation="-90 0 0"
        width="0.28"
        height="0.14"
        visible="false"
        animation="property: position; from: -0.45 -0.35 0.02; to: 0.45 -0.35 0.02; dur: 3500; easing: easeInOutSine; loop: true; dir: alternate">
      </a-image>

      <!-- Люди -->
      <a-image
        id="person1Entity"
        src="#person1"
        position="-0.25 -0.05 0.02"
        rotation="-90 0 0"
        width="0.09"
        height="0.22"
        visible="false">
      </a-image>

      <a-image
        id="person2Entity"
        src="#person2"
        position="0.30 -0.05 0.02"
        rotation="-90 0 0"
        width="0.09"
        height="0.22"
        visible="false">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const startScreen = document.getElementById('startScreen');
      const startButton = document.getElementById('startButton');
      const status = document.getElementById('status');
      const errorBox = document.getElementById('error');
      const target = document.getElementById('target');
      const car = document.getElementById('carEntity');
      const person1 = document.getElementById('person1Entity');
      const person2 = document.getElementById('person2Entity');

      let arStarted = false;

      function showError(message) {
        console.error(message);
        errorBox.textContent = message;
        errorBox.style.display = 'flex';
        status.textContent = 'Ошибка запуска AR';
      }

      function setFoundVisible(found) {
        car.setAttribute('visible', found);
        person1.setAttribute('visible', found);
        person2.setAttribute('visible', found);
      }

      target.addEventListener('targetFound', () => {
        setFoundVisible(true);
        status.textContent = 'Румбокс найден — AR работает';
        console.log('[MindAR] targetFound');
      });

      target.addEventListener('targetLost', () => {
        setFoundVisible(false);
        status.textContent = 'Наведите камеру на фасад румбокса';
        console.log('[MindAR] targetLost');
      });

      scene.addEventListener('arReady', () => {
        status.textContent = 'Камера запущена. Наведите её на румбокс';
        console.log('[MindAR] arReady');
      });

      scene.addEventListener('arError', (event) => {
        console.error('[MindAR] arError', event);
        showError('MindAR не смог запустить AR. Проверьте разрешение камеры в браузере.');
      });

      function startMindAR() {
        if (arStarted) return;

        // A-Frame создаёт систему mindar-image-system только после загрузки сцены.
        const arSystem = scene.systems && scene.systems['mindar-image-system'];

        if (!arSystem) {
          showError('Не найден MindAR system. Подождите загрузки страницы и попробуйте ещё раз.');
          console.error('scene.systems =', scene.systems);
          return;
        }

        arStarted = true;
        status.textContent = 'Запрашиваю доступ к камере…';
        startScreen.style.display = 'none';

        try {
          const result = arSystem.start();
          if (result && typeof result.catch === 'function') {
            result.catch(err => {
              arStarted = false;
              startScreen.style.display = 'flex';
              showError('Камера не запустилась: ' + (err?.message || err));
            });
          }
        } catch (err) {
          arStarted = false;
          startScreen.style.display = 'flex';
          showError('Камера не запустилась: ' + (err?.message || err));
        }
      }

      startButton.addEventListener('click', () => {
        status.textContent = 'Подготавливаю AR…';

        // Самый надёжный момент для обращения к scene.systems — событие loaded.
        if (scene.hasLoaded) {
          startMindAR();
        } else {
          scene.addEventListener('loaded', startMindAR, { once: true });
        }
      });

      if (!scene.hasLoaded) {
        scene.addEventListener('loaded', () => {
          console.log('[A-Frame] scene loaded');
          status.textContent = 'AR готов — нажмите «Запустить камеру»';
        }, { once: true });
      } else {
        status.textContent = 'AR готов — нажмите «Запустить камеру»';
      }
    });
  </script>
</body>
</html>
