<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cyberpunk Roombox — AR</title>

  <!-- Ровно та же связка CDN, что в mindar_clean_test.html — она у тебя точно работает -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin:0; overflow:hidden; }
    #status {
      position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
      z-index:9999; padding:9px 14px; border-radius:12px;
      background:rgba(0,0,0,.58); color:#fff;
      font:14px Arial,sans-serif; text-align:center;
      pointer-events:none; max-width:90vw;
    }
  </style>
</head>

<body>
  <div id="status">Запускаю AR…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="world" mindar-image-target="targetIndex: 0">

      <!-- Только ваша фотография. AR и камера оставлены без изменений. -->
      <a-image
        id="couplePhoto"
        src="#couplePhotoTexture"
        position="0 -0.02 0.06"
        width="0.82"
        height="1.23"
        material="shader: flat; transparent: true; alphaTest: 0.01; side: double">
      </a-image>

    </a-entity>


  <script>
    const scene = document.querySelector('a-scene');
    const target = document.querySelector('[mindar-image-target]');
    const status = document.getElementById('status');

    scene.addEventListener('loaded', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
    scene.addEventListener('arReady', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
    target.addEventListener('targetFound', () => { status.textContent = 'Румбокс найден!'; });
    target.addEventListener('targetLost', () => { status.textContent = 'Наведи снова на румбокс.'; });
    scene.addEventListener('arError', () => { status.textContent = 'Ошибка запуска AR.'; });
  </script>
</body>
</html>
