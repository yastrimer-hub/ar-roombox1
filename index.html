<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cyberpunk Roombox — AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 9999999;
      background: #0a0a12;
      color: #0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 18px;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #startScreen button {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #0ff;
      background: transparent;
      color: #0ff;
      cursor: pointer;
    }

    #status {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 18px;
      z-index: 10000000;
      color: #fff;
      text-align: center;
      font-size: 13px;
      text-shadow: 0 0 6px #000;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="startScreen">
    <div>Наведите камеру на фасад ромбокса,<br>чтобы он ожил.</div>
    <button id="startButton" type="button">Запустить камеру</button>
  </div>

  <div id="status">Подготовка AR…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="car" src="./assets/car.svg">
      <img id="person1" src="./assets/person.svg">
      <img id="person2" src="./assets/person.svg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-image
        src="#car"
        position="-0.45 -0.35 0.02"
        rotation="-90 0 0"
        width="0.28"
        height="0.14"
        animation="property: position; to: 0.45 -0.35 0.02; dur: 3500; easing: easeInOutSine; loop: true; dir: alternate">
      </a-image>

      <a-image
        src="#person1"
        position="-0.25 -0.05 0.02"
        rotation="-90 0 0"
        width="0.09"
        height="0.22"
        opacity="0"
        animation__appear="property: opacity; from: 0; to: 1; dur: 600; delay: 500; startEvents: targetFound">
      </a-image>

      <a-image
        src="#person2"
        position="0.3 -0.05 0.02"
        rotation="-90 0 0"
        width="0.09"
        height="0.22"
        opacity="0"
        animation__appear="property: opacity; from: 0; to: 1; dur: 600; delay: 2200; startEvents: targetFound">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      const startScreen = document.getElementById('startScreen');
      const startButton = document.getElementById('startButton');
      const status = document.getElementById('status');
      const target = document.getElementById('target');

      let arSystem = null;

      function setStatus(text) {
        status.textContent = text;
      }

      sceneEl.addEventListener('loaded', () => {
        arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) {
          setStatus('Ошибка: MindAR не загрузился.');
          return;
        }
        setStatus('AR готов. Нажмите «Запустить камеру».');
      });

      startButton.addEventListener('click', async () => {
        try {
          if (!arSystem) {
            arSystem = sceneEl.systems['mindar-image-system'];
          }

          if (!arSystem) {
            throw new Error('MindAR system not found');
          }

          startScreen.style.display = 'none';
          setStatus('Запускаю камеру…');
          arSystem.start();
        } catch (error) {
          console.error('MindAR start error:', error);
          startScreen.style.display = 'flex';
          setStatus('Не удалось запустить камеру: ' + (error.message || error));
        }
      });

      sceneEl.addEventListener('arReady', () => {
        setStatus('Камера запущена. Наведите её на фасад ромбокса.');
      });

      sceneEl.addEventListener('arError', (event) => {
        console.error('MindAR arError:', event);
        startScreen.style.display = 'flex';
        setStatus('MindAR не смог запустить камеру. Проверьте разрешение камеры и браузер.');
      });

      target.addEventListener('targetFound', () => {
        setStatus('Цель найдена — AR активен.');
      });

      target.addEventListener('targetLost', () => {
        setStatus('Цель потеряна — наведите камеру на изображение.');
      });
    });
  </script>
</body>
</html>
