<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cyberpunk Roombox — AR (anime)</title>

  <!-- AR/камера НЕ ИЗМЕНЕНЫ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; overflow:hidden; }
    #status {
      position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
      z-index:9999; padding:9px 14px; border-radius:12px;
      background:rgba(0,0,0,.58); color:#fff;
      font:14px Arial,sans-serif; text-align:center;
      pointer-events:none; max-width:90vw;
    }
  </style>
</head>

<body>
  <div id="status">Запускаю AR…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- КАМЕРА НЕ ТРОГНУТА -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="world" mindar-image-target="targetIndex: 0">
      <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>

      <!--
        НОВЫЕ КООРДИНАТЫ ПОД ПЕРЕСНЯТЫЙ TARGET:
        target = 601 x 1270, поэтому относительно старого target
        вертикальные координаты скорректированы под новый ratio.

        парень  → нижняя левая зона
        пара    → мостик/верхняя центральная зона
        машина  → низ дороги
      -->

      <!-- АНИМЕ-ПАРЕНЬ -->
      <a-entity
        id="guy"
        position="-0.18 -0.534 0.06"
        animation__breathe="property: scale; from: 0.99 0.99 1; to: 1.01 1.02 1; dur: 2400; easing: easeInOutSine; direction: alternate; loop: true"
        animation__sway="property: rotation; from: 0 0 -1.2; to: 0 0 1.2; dur: 3400; easing: easeInOutSine; direction: alternate; loop: true">
        <a-plane data-sprite="guy" width="0.171" height="0.30"
                 material="shader: flat; transparent: true; opacity: 0"></a-plane>
      </a-entity>

      <!-- АНИМЕ-ПАРА -->
      <a-entity
        id="couple"
        position="0.01 0.10 0.05"
        animation__breathe="property: scale; from: 0.99 0.99 1; to: 1.015 1.015 1; dur: 2800; easing: easeInOutSine; direction: alternate; loop: true">
        <a-plane data-sprite="couple" width="0.186" height="0.20"
                 material="shader: flat; transparent: true; opacity: 0"></a-plane>
      </a-entity>

      <!-- АНИМЕ-МАШИНА -->
      <a-entity
        id="car"
        position="-0.04 -0.467 0.10"
        animation__bob="property: position; from: -0.04 -0.467 0.10; to: -0.04 -0.432 0.10; dur: 1900; easing: easeInOutSine; direction: alternate; loop: true"
        animation__tilt="property: rotation; from: 0 0 -1.2; to: 0 0 1.2; dur: 2600; easing: easeInOutSine; direction: alternate; loop: true">
        <a-plane data-sprite="car" width="0.422" height="0.15"
                 material="shader: flat; transparent: true; opacity: 0"></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

<script>
/* ============================================================
   2D SVG-СПРАЙТЫ. Это НЕ 3D-персонажи.
   Два кадра у персонажей = открытые/закрытые глаза.
   Машина получает два кадра яркости.
   ============================================================ */

        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">

    </defs>

    <g stroke="#0a1018" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

      <path d="M112 230 Q92 270 90 338 L128 342 Q128 302 144 238Z" fill="url(#hood)"/>
      <path d="M196 210 L226 206 Q258 250 252 300 L214 298 Q218 266 196 210Z" fill="url(#hood)"/>

      <path d="M122 132 Q122 84 162 84 Q204 84 204 132 Q202 166 162 198 Q124 166 122 132Z" fill="url(#skin)"/>
      <path d="M104 158 Q97 99 128 64 Q160 48 195 70 Q223 102 219 158 Q201 126 162 112 Q126 125 104 158Z" fill="url(#hood)"/>
      <path d="M172 184 Q190 176 206 202 Q204 218 186 224 Q164 206 172 184Z" fill="url(#skin)"/>

    </g>

    <path d="M152 186 Q162 190 172 186" fill="none" stroke="#7c3f34" stroke-width="4"/>
    <g transform="rotate(-22 168 190)">
      <rect x="128" y="184" width="46" height="9" rx="4" fill="#f1efe6"/>

    </g>

    ${eyes}
    <path d="M110 238 Q130 202 160 196" fill="none" stroke="#3ef0ff" stroke-width="7" opacity=".8" filter="url(#soft)"/>
    <path d="M214 300 Q250 300 244 224" fill="none" stroke="#ff4fd3" stroke-width="7" opacity=".75" filter="url(#soft)"/>
  </svg>`;
}

      <path d="M296 150 Q280 220 300 322 Q350 338 402 322 Q420 218 404 150 Q352 180 296 150Z" fill="url(#h)"/>

    ${eyes}

function carSVG(phase){
  const glow = phase === 0 ? 0.55 : 0.95;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
    <defs>
      <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e7edf5"/><stop offset=".45" stop-color="#9aa6bd"/><stop offset="1" stop-color="#4b5568"/>
      </linearGradient>
      <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8fd8ec"/><stop offset="1" stop-color="#1c4356"/>
      </linearGradient>
      <filter id="g" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="7" result="x"/>
        <feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <path d="M0 140 Q140 128 268 130" fill="none" stroke="#c9fbff" stroke-width="10" opacity="${glow}" filter="url(#g)"/>
    <path d="M0 205 Q140 212 268 196" fill="none" stroke="#c9fbff" stroke-width="6" opacity="${glow*.7}" filter="url(#g)"/>
    <g stroke="#12151d" stroke-width="5" stroke-linejoin="round">
      <path d="M870 190 L760 150 L660 95 H560 L460 150 L380 158 H350 V215 H870Z" fill="url(#b)"/>
      <path d="M665 102 L755 148 L742 151 L652 106Z" fill="url(#gl)"/>
      <path d="M565 100 L468 148 L455 151 L562 104Z" fill="url(#gl)"/>
      <path d="M380 176 Q620 190 858 176" fill="none" stroke="#eef4fb" stroke-width="4" opacity=".6"/>
    </g>
    <ellipse cx="760" cy="223" rx="46" ry="9" fill="#7ef4ff" opacity="${glow}" filter="url(#g)"/>
    <ellipse cx="430" cy="223" rx="46" ry="9" fill="#7ef4ff" opacity="${glow}" filter="url(#g)"/>
    <circle cx="838" cy="179" r="${phase===0?5:8}" fill="#fff6c4" filter="url(#g)"/>
    <circle cx="812" cy="186" r="${phase===0?4:6}" fill="#fff6c4" filter="url(#g)"/>
    <rect x="352" y="168" width="22" height="10" rx="4" fill="#ff3b3b" opacity="${phase===0?1:.35}" filter="url(#g)"/>
  </svg>`;
}

/* ============================================================
   FLIPBOOK-ТЕКСТУРА: canvas -> THREE CanvasTexture
   ============================================================ */
const SS = 2;

function toDataURI(svg){
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.trim());
}

function loadImage(svg){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = toDataURI(svg);
  });
}

async function setupSprite(el, frames){
  const m = frames[0].match(/width="(\d+)" height="(\d+)"/);
  const w = m ? +m[1] : 512, h = m ? +m[2] : 512;
  const images = await Promise.all(frames.map(loadImage));

  const canvas = document.createElement('canvas');
  canvas.width = w * SS;
  canvas.height = h * SS;
  const ctx = canvas.getContext('2d');

  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;

  function setFrame(i){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(images[i],0,0,canvas.width,canvas.height);
    tex.needsUpdate = true;
  }

  setFrame(0);

  const put = () => {
    const mesh = el.getObject3D('mesh');
    if(!mesh){
      el.addEventListener('loaded',put,{once:true});
      return;
    }
    mesh.material = new THREE.MeshBasicMaterial({
      map: tex,
      transparent: true,
      alphaTest: 0.01,
      side: THREE.DoubleSide,
      toneMapped: false,
      depthWrite: false
    });
    mesh.material.needsUpdate = true;
  };
  put();

  return {setFrame};
}

function scheduleBlink(ctrl,minDelay,maxDelay){
  const wait = minDelay + Math.random()*(maxDelay-minDelay);
  setTimeout(()=>{
    ctrl.setFrame(1);
    setTimeout(()=>{
      ctrl.setFrame(0);
      scheduleBlink(ctrl,minDelay,maxDelay);
    },130);
  },wait);
}

(async()=>{
  const guyEls = [...document.querySelectorAll('[data-sprite="guy"]')];
  const coupleEls = [...document.querySelectorAll('[data-sprite="couple"]')];
  const carEls = [...document.querySelectorAll('[data-sprite="car"]')];

  const guyFrames = [guySVG(false),guySVG(true)];
  const coupleFrames = [coupleSVG(false),coupleSVG(true)];
  const carFrames = [carSVG(0),carSVG(1)];

  const guyCtrls = await Promise.all(guyEls.map(e=>setupSprite(e,guyFrames)));
  const coupleCtrls = await Promise.all(coupleEls.map(e=>setupSprite(e,coupleFrames)));
  const carCtrls = await Promise.all(carEls.map(e=>setupSprite(e,carFrames)));

  guyCtrls.forEach(c=>scheduleBlink(c,2200,4200));
  coupleCtrls.forEach(c=>scheduleBlink(c,2600,4800));

  carCtrls.forEach(c=>{
    let phase=0;
    setInterval(()=>{
      phase=1-phase;
      c.setFrame(phase);
    },550);
  });
})();

/* статус AR */
const scene = document.querySelector('a-scene');
const target = document.querySelector('[mindar-image-target]');
const status = document.getElementById('status');

scene.addEventListener('loaded',()=>{
  status.textContent='Камера запущена. Наведи на румбокс.';
});
scene.addEventListener('arReady',()=>{
  status.textContent='Камера запущена. Наведи на румбокс.';
});
scene.addEventListener('arError',()=>{
  status.textContent='Ошибка запуска AR.';
});
target.addEventListener('targetFound',()=>{
  status.textContent='Румбокс найден!';
});
target.addEventListener('targetLost',()=>{
  status.textContent='Наведи снова на румбокс.';
});
</script>
</body>
</html>
