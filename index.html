<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Future World — 3D AR</title>

  <!-- Та же проверенная основа, что у работающего mindar_clean_test.html -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 10px 15px;
      border-radius: 12px;
      color: #fff;
      background: rgba(0,0,0,.62);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      max-width: 90vw;
    }

    /* Не нужен для AR, но скрывает лишний интерфейс браузера/сцены. */
    a-scene {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

  <div id="status">Загрузка 3D AR…</div>

  <!-- ВАЖНО:
       Эта конфигурация почти идентична чистому тесту, который у тебя уже заработал. -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; uiScanning: no"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="world" mindar-image-target="targetIndex: 0">

      <!-- ==========================================
           1. ОСВЕЩЕНИЕ
           ========================================== -->

      <a-light type="ambient" color="#b8c9ff" intensity="0.35"></a-light>

      <a-entity id="streetLampLeft" position="-0.38 -0.05 0.12">
        <a-cylinder position="0 0.22 0" radius="0.014" height="0.44"
          color="#313842" material="shader: standard; roughness: .5"></a-cylinder>
        <a-sphere id="lampLeft"
          position="0 0.46 0"
          radius="0.042"
          color="#69eaff"
          material="shader: standard; emissive: #45dfff; emissiveIntensity: 3">
        </a-sphere>
        <a-light id="lightLeft"
          type="point"
          position="0 0.45 0"
          color="#3cdfff"
          intensity="1.25"
          distance="1.15">
        </a-light>
      </a-entity>

      <a-entity id="streetLampRight" position="0.38 0.18 0.12">
        <a-cylinder position="0 0.22 0" radius="0.014" height="0.44"
          color="#313842" material="shader: standard; roughness: .5"></a-cylinder>
        <a-sphere id="lampRight"
          position="0 0.46 0"
          radius="0.042"
          color="#ff79df"
          material="shader: standard; emissive: #ff42c9; emissiveIntensity: 3">
        </a-sphere>
        <a-light id="lightRight"
          type="point"
          position="0 0.45 0"
          color="#ff45cf"
          intensity="1.15"
          distance="1.15">
        </a-light>
      </a-entity>

      <!-- ==========================================
           2. МАШИНА 3D
           ДВИЖЕТСЯ ТОЛЬКО ПО ЦЕНТРУ ДОРОГИ.
           X всегда = 0.02, меняется только Y.
           ========================================== -->

      <a-entity
        id="car"
        position="0.02 -0.92 0.12"
        rotation="0 0 0"
        animation__drive="property: position; from: 0.02 -0.92 0.12; to: 0.02 0.76 0.12; dur: 6000; easing: linear; loop: true">

        <!-- основной кузов -->
        <a-box
          position="0 0.10 0"
          width="0.27"
          height="0.13"
          depth="0.44"
          color="#d4d8df"
          material="shader: standard; metalness: .65; roughness: .25">
        </a-box>

        <!-- нижняя часть -->
        <a-box
          position="0 0.045 0"
          width="0.30"
          height="0.055"
          depth="0.40"
          color="#282d35"
          material="shader: standard; metalness: .55; roughness: .35">
        </a-box>

        <!-- крыша/салон -->
        <a-box
          position="0 0.205 -0.035"
          width="0.20"
          height="0.14"
          depth="0.22"
          color="#232a35"
          material="shader: standard; metalness: .18; roughness: .22">
        </a-box>

        <!-- переднее стекло -->
        <a-box
          position="0 0.215 0.078"
          width="0.16"
          height="0.065"
          depth="0.012"
          color="#74d0ec"
          material="shader: standard; metalness: .05; roughness: .08; transparent: true; opacity: .78">
        </a-box>

        <!-- заднее стекло -->
        <a-box
          position="0 0.215 -0.148"
          width="0.16"
          height="0.065"
          depth="0.012"
          color="#33485b"
          material="shader: standard; metalness: .05; roughness: .12; transparent: true; opacity: .72">
        </a-box>

        <!-- колёса -->
        <a-cylinder position="-0.16 0.055 0.14"
          radius="0.058" height="0.035" rotation="90 0 0"
          color="#14161a" material="shader: standard; roughness: .82"
          animation__wheel="property: rotation; from: 90 0 0; to: 90 0 360; dur: 420; easing: linear; loop: true">
        </a-cylinder>

        <a-cylinder position="0.16 0.055 0.14"
          radius="0.058" height="0.035" rotation="90 0 0"
          color="#14161a" material="shader: standard; roughness: .82"
          animation__wheel="property: rotation; from: 90 0 0; to: 90 0 360; dur: 420; easing: linear; loop: true">
        </a-cylinder>

        <a-cylinder position="-0.16 0.055 -0.14"
          radius="0.058" height="0.035" rotation="90 0 0"
          color="#14161a" material="shader: standard; roughness: .82"
          animation__wheel="property: rotation; from: 90 0 0; to: 90 0 360; dur: 420; easing: linear; loop: true">
        </a-cylinder>

        <a-cylinder position="0.16 0.055 -0.14"
          radius="0.058" height="0.035" rotation="90 0 0"
          color="#14161a" material="shader: standard; roughness: .82"
          animation__wheel="property: rotation; from: 90 0 0; to: 90 0 360; dur: 420; easing: linear; loop: true">
        </a-cylinder>

        <!-- фары -->
        <a-sphere position="-0.085 0.14 0.225" radius="0.022"
          color="#fff1a8"
          material="shader: standard; emissive: #ffe780; emissiveIntensity: 2.4">
        </a-sphere>
        <a-sphere position="0.085 0.14 0.225" radius="0.022"
          color="#fff1a8"
          material="shader: standard; emissive: #ffe780; emissiveIntensity: 2.4">
        </a-sphere>

        <!-- красные задние фонари -->
        <a-box position="-0.075 0.125 -0.225"
          width="0.05" height="0.025" depth="0.012"
          color="#ff3046"
          material="shader: standard; emissive: #ff263d; emissiveIntensity: 1.8">
        </a-box>
        <a-box position="0.075 0.125 -0.225"
          width="0.05" height="0.025" depth="0.012"
          color="#ff3046"
          material="shader: standard; emissive: #ff263d; emissiveIntensity: 1.8">
        </a-box>

      </a-entity>

      <!-- ==========================================
           3. ЧЕЛОВЕК A — 3D, ИДЁТ ПО КРАЮ ДОРОГИ
           ========================================== -->

      <a-entity
        id="personA"
        position="0.22 -0.72 0.14"
        scale="0.66 0.66 0.66"
        animation="property: position; from: 0.22 -0.72 0.14; to: 0.22 0.62 0.14; dur: 7000; easing: linear; loop: true">

        <!-- голова -->
        <a-sphere position="0 0.38 0"
          radius="0.065"
          color="#c99372"
          material="shader: standard; roughness: .65">
        </a-sphere>

        <!-- волосы -->
        <a-sphere position="0 0.415 -0.015"
          radius="0.065"
          color="#26242a"
          material="shader: standard; roughness: .8">
        </a-sphere>

        <!-- тело -->
        <a-cylinder position="0 0.245 0"
          radius="0.075"
          height="0.22"
          color="#3a79b8"
          material="shader: standard; roughness: .55">
        </a-cylinder>

        <!-- левая рука -->
        <a-entity position="-0.09 0.27 0"
          animation="property: rotation; from: 0 0 -22; to: 0 0 28; dur: 420; direction: alternate; easing: easeInOutSine; loop: true">
          <a-cylinder position="0 -0.075 0"
            radius="0.022" height="0.15"
            color="#c99372">
          </a-cylinder>
        </a-entity>

        <!-- правая рука -->
        <a-entity position="0.09 0.27 0"
          animation="property: rotation; from: 0 0 28; to: 0 0 -22; dur: 420; direction: alternate; easing: easeInOutSine; loop: true">
          <a-cylinder position="0 -0.075 0"
            radius="0.022" height="0.15"
            color="#c99372">
          </a-cylinder>
        </a-entity>

        <!-- левая нога -->
        <a-entity position="-0.038 0.135 0"
          animation="property: rotation; from: -12 0 0; to: 18 0 0; dur: 420; direction: alternate; easing: easeInOutSine; loop: true">
          <a-cylinder position="0 -0.115 0"
            radius="0.026" height="0.23"
            color="#292d35">
          </a-cylinder>
        </a-entity>

        <!-- правая нога -->
        <a-entity position="0.038 0.135 0"
          animation="property: rotation; from: 18 0 0; to: -12 0 0; dur: 420; direction: alternate; easing: easeInOutSine; loop: true">
          <a-cylinder position="0 -0.115 0"
            radius="0.026" height="0.23"
            color="#292d35">
          </a-cylinder>
        </a-entity>

      </a-entity>

      <!-- ==========================================
           4. ЧЕЛОВЕК B — НА ВСТРЕЧНОЙ СТОРОНЕ
           ========================================== -->

      <a-entity
        id="personB"
        position="-0.20 0.65 0.14"
        scale="0.58 0.58 0.58"
        animation="property: position; from: -0.20 0.65 0.14; to: -0.20 -0.73 0.14; dur: 7600; easing: linear; loop: true">

        <a-sphere position="0 0.38 0"
          radius="0.065"
          color="#b67d5d"
          material="shader: standard; roughness: .7">
        </a-sphere>

        <a-sphere position="0 0.415 -0.015"
          radius="0.065"
          color="#542f29"
          material="shader: standard; roughness: .82">
        </a-sphere>

        <a-cylinder position="0 0.245 0"
          radius="0.075"
          height="0.22"
          color="#a63f62"
          material="shader: standard; roughness: .55">
        </a-cylinder>

        <a-entity position="-0.09 0.27 0"
          animation="property: rotation; from: 0 0 25; to: 0 0 -25; dur: 450; direction: alternate; easing: easeInOutSine; loop: true">
          <a-cylinder position="0 -0.075 0"
            radius="0.022" height="0.15"
            color="#b67d5d">
          </a-cylinder>
        </a-entity>

        <a-entity position="0.09 0.27 0"
          animation="property: rotation; from: 0 0 -25; to: 0 0 25; dur: 450; direction: alternate; easing: easeInOutSine; loop: true">
          <a-cylinder position="0 -0.075 0"
            radius="0.022" height="0.15"
            color="#b67d5d">
          </a-cylinder>
        </a-entity>

        <a-entity position="-0.038 0.135 0"
          animation="property: rotation; from: 16 0 0; to: -16 0 0; dur: 450; direction: alternate; easing: easeInOutSine; loop: true">
          <a-cylinder position="0 -0.115 0"
            radius="0.026" height="0.23"
            color="#34333a">
          </a-cylinder>
        </a-entity>

        <a-entity position="0.038 0.135 0"
          animation="property: rotation; from: -16 0 0; to: 16 0 0; dur: 450; direction: alternate; easing: easeInOutSine; loop: true">
          <a-cylinder position="0 -0.115 0"
            radius="0.026" height="0.23"
            color="#34333a">
          </a-cylinder>
        </a-entity>

      </a-entity>

      <!-- ==========================================
           5. НЕОН / СВЕТОФОР
           ========================================== -->

      <a-entity position="0 0.42 0.16">
        <a-box position="0 0 0" width="0.16" height="0.09" depth="0.035"
          color="#20242b" material="shader: standard; roughness: .42">
        </a-box>

        <a-sphere id="signalRed" position="-0.05 0 0.025" radius="0.017"
          color="#ff3848"
          material="shader: standard; emissive: #ff283a; emissiveIntensity: 2">
        </a-sphere>

        <a-sphere id="signalYellow" position="0 0 0.025" radius="0.017"
          color="#ffca4d"
          material="shader: standard; emissive: #ffc33a; emissiveIntensity: 0.7">
        </a-sphere>

        <a-sphere id="signalGreen" position="0.05 0 0.025" radius="0.017"
          color="#54ed9c"
          material="shader: standard; emissive: #39e58a; emissiveIntensity: 0.7">
        </a-sphere>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const target = document.querySelector('[mindar-image-target]');
    const status = document.getElementById('status');

    scene.addEventListener('loaded', () => {
      status.textContent = 'Камера запущена. Наведи на румбокс.';
    });

    scene.addEventListener('arReady', () => {
      status.textContent = 'Камера запущена. Наведи на румбокс.';
    });

    target.addEventListener('targetFound', () => {
      status.textContent = 'Румбокс найден — 3D-сцена работает!';
    });

    target.addEventListener('targetLost', () => {
      status.textContent = 'Ищу румбокс…';
    });

    scene.addEventListener('arError', () => {
      status.textContent = 'Ошибка запуска AR';
    });

    /* ===== Живое мерцание фонарей ===== */
    const lightLeft = document.getElementById('lightLeft');
    const lightRight = document.getElementById('lightRight');

    let timer = 0;

    setInterval(() => {
      timer += 1;

      // Небольшое хаотическое мигание, а не постоянное "вкл/выкл".
      const left = 0.75 + Math.random() * 0.85;
      const right = 0.65 + Math.random() * 0.95;

      lightLeft.setAttribute('intensity', left);
      lightRight.setAttribute('intensity', right);

      document.getElementById('lampLeft').setAttribute('material',
        `shader: standard; emissive: #45dfff; emissiveIntensity: ${1.5 + Math.random() * 2.5}`);

      document.getElementById('lampRight').setAttribute('material',
        `shader: standard; emissive: #ff42c9; emissiveIntensity: ${1.5 + Math.random() * 2.4}`);

      // Иногда коротко гасим один свет, чтобы появился эффект неисправной вывески.
      if (timer % 7 === 0) lightLeft.setAttribute('intensity', 0.08);
      if (timer % 11 === 0) lightRight.setAttribute('intensity', 0.08);
    }, 280);

    /* ===== Светофор переключается ===== */
    const red = document.getElementById('signalRed');
    const yellow = document.getElementById('signalYellow');
    const green = document.getElementById('signalGreen');

    let signalState = 0;

    function updateSignal() {
      // 0 = красный, 1 = жёлтый, 2 = зелёный
      red.setAttribute('material',
        `shader: standard; emissive: #ff283a; emissiveIntensity: ${signalState === 0 ? 3 : 0.25}`);
      yellow.setAttribute('material',
        `shader: standard; emissive: #ffc33a; emissiveIntensity: ${signalState === 1 ? 3 : 0.25}`);
      green.setAttribute('material',
        `shader: standard; emissive: #39e58a; emissiveIntensity: ${signalState === 2 ? 3 : 0.25}`);

      signalState = (signalState + 1) % 3;
    }

    updateSignal();
    setInterval(updateSignal, 1700);
  </script>

</body>
</html>
