<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cyberpunk Roombox — AR (anime)</title>

  <!-- та же связка CDN, что и раньше -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin:0; overflow:hidden; }
    #status {
      position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
      z-index:9999; padding:9px 14px; border-radius:12px;
      background:rgba(0,0,0,.58); color:#fff;
      font:14px Arial,sans-serif; text-align:center;
      pointer-events:none; max-width:90vw;
    }
  </style>
</head>

<body>
  <div id="status">Запускаю AR…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="world" mindar-image-target="targetIndex: 0">

      <!-- спрайты рисуются flat-шейдером, свет им не нужен,
           но оставляю ambient на случай если добавишь 3D-объекты -->
      <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>

      <!-- =========================================================
           ПАРЕНЬ В ЗЕЛЁНОМ ХУДИ, ОПЁРСЯ НОГОЙ НА АВТОМАТ.
           Плоский аниме-спрайт. Настройка:
           position = X(лево/право) Y(верх/низ) Z(ближе/дальше)
           width/height — размер. Пропорции спрайта 320:560.
           ========================================================= -->
      <a-entity id="leaningGuy" position="-0.15 -0.39 0.06">
        <a-plane data-sprite="guy" width="0.171" height="0.30"
                 material="shader: flat; transparent: true; opacity: 0"></a-plane>

        <!-- дымок от сигареты -->
        <a-circle radius="0.012" position="0.005 -0.005 0.002"
          material="shader: flat; color:#dfe6ef; transparent:true; opacity:.20"
          animation="property: position; from: 0.005 -0.005 0.002; to: 0.028 0.10 0.002; dur: 2600; easing: easeOutQuad; loop: true"
          animation__o="property: material.opacity; from: 0.26; to: 0; dur: 2600; easing: linear; loop: true"></a-circle>
        <a-circle radius="0.008" position="0.012 0.03 0.002"
          material="shader: flat; color:#dfe6ef; transparent:true; opacity:.14"
          animation="property: position; from: 0.012 0.03 0.002; to: 0.040 0.13 0.002; dur: 2600; delay: 900; easing: easeOutQuad; loop: true"
          animation__o="property: material.opacity; from: 0.18; to: 0; dur: 2600; delay: 900; easing: linear; loop: true"></a-circle>
      </a-entity>


      <!-- =========================================================
           ПАРА В ОБНИМКУ НА МОСТИКЕ. Пропорции спрайта 520:560.
           ========================================================= -->
      <a-entity id="couple" position="0.0 0.13 0.05">
        <a-plane data-sprite="couple" width="0.186" height="0.20"
                 material="shader: flat; transparent: true; opacity: 0"></a-plane>
      </a-entity>


      <!-- =========================================================
           ЛЕТАЮЩАЯ МАШИНА. Пропорции спрайта 640:320.
           ========================================================= -->
      <a-entity id="hoverCar"
        position="0.13 0.12 0.18"
        animation="property: position; from: 0.13 0.12 0.18; to: 0.13 0.155 0.18;
                   dur: 1900; easing: easeInOutSine; direction: alternate; loop: true">

        <a-plane data-sprite="car" width="0.30" height="0.15"
                 material="shader: flat; transparent: true; opacity: 0"></a-plane>

        <!-- пульсирующая неоновая подсветка под машиной -->
        <a-plane width="0.26" height="0.06" position="0 -0.075 -0.002"
          material="shader: flat; color:#38dfff; transparent:true; opacity:.18"
          animation="property: material.opacity; from: .10; to: .26; dur: 1200;
                     easing: easeInOutSine; direction: alternate; loop: true"></a-plane>
      </a-entity>

    </a-entity>
  </a-scene>

  /* ---------- натягиваем SVG как текстуры на плоскости ----------
     SVG сначала рисуется в canvas, и уже canvas идёт текстурой.
     Так работает и в Safari на iPhone, где SVG-текстура напрямую
     даёт чёрный прямоугольник.
     SS — множитель разрешения текстуры (2 = чётче, но тяжелее).      */
  const SS = 2;

  function toDataURI(svg){
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.trim());
  }

  function applySprite(el, svg){
    const m = svg.match(/viewBox="0 0 (\d+) (\d+)"/);
    const w = m ? +m[1] : 512, h = m ? +m[2] : 512;

    const img = new Image();
    img.crossOrigin = 'anonymous';

    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width  = w * SS;
      canvas.height = h * SS;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 4;
      if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      else tex.encoding = THREE.sRGBEncoding;
      tex.needsUpdate = true;

      const put = () => {
        const mesh = el.getObject3D('mesh');
        if (!mesh) { el.addEventListener('loaded', put, { once: true }); return; }
        mesh.material = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          alphaTest: 0.01,
          side: THREE.DoubleSide,
          toneMapped: false,
          depthWrite: false
        });
        mesh.material.needsUpdate = true;
      };
      put();
    };

    img.onerror = () => {
      document.getElementById('status').textContent = 'Спрайт не загрузился: ' + el.dataset.sprite;
    };

    img.src = toDataURI(svg);
  }

  document.querySelectorAll('[data-sprite]').forEach(el => {
    const svg = SPRITES[el.dataset.sprite];
    if (svg) applySprite(el, svg);
  });

  /* ---------- статус AR ---------- */
  const scene  = document.querySelector('a-scene');
  const target = document.querySelector('[mindar-image-target]');
  const status = document.getElementById('status');

  scene.addEventListener('loaded',  () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
  scene.addEventListener('arReady', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
  target.addEventListener('targetFound', () => { status.textContent = 'Румбокс найден!'; });
  target.addEventListener('targetLost',  () => { status.textContent = 'Наведи снова на румбокс.'; });
  scene.addEventListener('arError', () => { status.textContent = 'Ошибка запуска AR.'; });
  </script>
