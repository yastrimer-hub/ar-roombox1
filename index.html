  <script>
  /* ==========================================================================
     ВСЯ ГРАФИКА — ЗДЕСЬ. Это обычные SVG-картинки (2D, аниме-стиль),
     которые натягиваются текстурой на плоскости выше.
     Хочешь поменять цвет/деталь — правь SVG, никакой 3D-математики.
     ========================================================================== */

  const SPRITES = {};

  /* ---------------- ПАРЕНЬ В ХУДИ (320 x 560) ----------------
     Функция принимает blink: false = глаза открыты (светятся),
     true = глаза закрыты (моргание). Два кадра дают "живую" анимацию
     без всякой 3D-математики — просто смена картинки во времени. */
  function guySVG(blink){
  const guyEyes = blink
    ? `<path d="M130,151 C138,145 152,145 160,151" fill="none" stroke="#0a1018" stroke-width="5" stroke-linecap="round"/>
       <path d="M194,151 C188,145 176,145 168,151" fill="none" stroke="#0a1018" stroke-width="5" stroke-linecap="round"/>`
    : `<g filter="url(#fGlow)">
        <path d="M132,152 C138,140 152,138 158,150 C156,166 146,172 138,168 C131,164 129,158 132,152 Z" fill="#62f7ff"/>
        <path d="M196,152 C190,140 176,138 170,150 C172,166 182,172 190,168 C197,164 199,158 196,152 Z" fill="#62f7ff"/>
      </g>
      <circle cx="145" cy="150" r="3.5" fill="#ffffff"/>
      <circle cx="183" cy="150" r="3.5" fill="#ffffff"/>`;
  return `
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="560" viewBox="0 0 320 560">
  <defs>
    <linearGradient id="gHood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bf0ab"/><stop offset=".5" stop-color="#219a66"/><stop offset="1" stop-color="#0c4a31"/>
    </linearGradient>
    <linearGradient id="gHoodBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d7d52"/><stop offset="1" stop-color="#083221"/>
    </linearGradient>
    <linearGradient id="gPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3549"/><stop offset="1" stop-color="#10131b"/>
    </linearGradient>
    <linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdcbc"/><stop offset="1" stop-color="#d69873"/>
    </linearGradient>
    <filter id="fGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <g stroke="#0a1018" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- согнутая нога: стопа упирается в автомат -->
    <path d="M178,318 L220,316 C252,342 274,378 284,418 L246,438 C234,400 210,368 178,350 Z" fill="url(#gPants)"/>
    <path d="M284,418 L246,438 L256,486 L296,478 Z" fill="url(#gPants)"/>
    <path d="M242,478 L298,470 C314,468 318,484 308,494 L250,504 Z" fill="#1b202b"/>

    <!-- опорная нога -->
    <path d="M126,322 L178,322 L184,512 L132,512 Z" fill="url(#gPants)"/>
    <path d="M124,500 L186,500 L190,534 C190,544 182,548 170,548 L128,548 C116,548 112,540 114,532 Z" fill="#1b202b"/>

    <!-- капюшон сзади -->
    <ellipse cx="160" cy="146" rx="68" ry="78" fill="url(#gHoodBack)"/>

    <!-- худи -->
    <path d="M110,238 C110,210 132,196 160,196 C190,196 212,212 212,240 L220,326 C220,342 196,352 160,352 C124,352 100,342 102,326 Z" fill="url(#gHood)"/>

    <!-- левая рука, свисает -->
    <path d="M112,230 C94,264 88,302 90,338 L128,342 C128,302 132,264 144,238 Z" fill="url(#gHood)"/>
    <path d="M88,334 C104,330 120,336 120,350 C120,364 102,370 92,362 C84,356 82,342 88,334 Z" fill="url(#gSkin)"/>

    <!-- правая рука поднята ко рту -->
    <path d="M196,210 L226,206 C250,236 258,272 252,300 L214,298 C218,266 212,236 196,210 Z" fill="url(#gHood)"/>
    <path d="M214,298 L252,300 C242,254 222,218 200,196 L172,214 C192,238 208,264 214,298 Z" fill="url(#gHood)"/>
    <path d="M172,184 C190,176 208,186 206,202 C204,218 186,224 174,214 C164,206 164,190 172,184 Z" fill="url(#gSkin)"/>

    <!-- лицо -->
    <path d="M122,132 C122,100 140,84 162,84 C186,84 204,100 204,132 C204,162 190,186 162,198 C134,186 122,162 122,132 Z" fill="url(#gSkin)"/>

    <!-- чёлка -->
    <path d="M124,126 C126,96 142,80 162,80 C184,80 202,96 202,126 C194,112 180,120 166,110 C156,124 138,116 124,126 Z" fill="#1b2431"/>

    <!-- козырёк капюшона поверх лба -->
    <path d="M104,158 C96,96 124,58 162,58 C200,58 228,96 220,158 C204,126 188,112 162,112 C136,112 120,126 104,158 Z" fill="url(#gHood)"/>

    <!-- завязки -->
    <path d="M132,196 C128,224 130,244 134,258" fill="none" stroke-width="6"/>
    <path d="M190,196 C196,222 196,242 192,256" fill="none" stroke-width="6"/>

    <!-- карман-кенгуру -->
    <path d="M118,288 C140,306 182,306 204,288" fill="none" stroke-width="4"/>
  </g>

  <!-- тень от капюшона на лице -->
  <path d="M120,124 C140,114 184,114 204,124 L204,172 C182,182 140,182 120,172 Z" fill="#061019" opacity=".55"/>

  <!-- глаза: открыты или закрыты, зависит от кадра -->
  ${guyEyes}

  <!-- рот + сигарета -->
  <path d="M152,186 C158,190 166,190 172,186" fill="none" stroke="#7c3f34" stroke-width="4" stroke-linecap="round"/>
  <g transform="rotate(-22 168 190)">
    <rect x="128" y="184" width="46" height="9" rx="4.5" fill="#f1efe6" stroke="#0a1018" stroke-width="3"/>
    <rect x="120" y="183" width="12" height="11" rx="5" fill="#ff7a3c"/>

    <!-- юбка/пальто -->

  <!-- лица: парень -->
  <g>
    ${guyInCoupleEyes}
    <path d="M188,172 C194,177 202,177 208,172" fill="none" stroke="#a45a4c" stroke-width="4" stroke-linecap="round"/>

  <!-- маленькое голо-сердечко над парой -->
  <g filter="url(#cGlow)" opacity=".95">

  <path d="M400,214 L404,308" fill="none" stroke="#ff4fd3" stroke-width="7" opacity=".75" filter="url(#cSoft)" stroke-linecap="round"/>
  <path d="M296,150 C282,206 288,280 300,320" fill="none" stroke="#ff6fd8" stroke-width="5" opacity=".55" filter="url(#cSoft)"/>
</svg>`;
  }

  const FRAMES_COUPLE = [ coupleSVG(false), coupleSVG(true) ];

  /* ---------------- ЛЕТАЮЩАЯ МАШИНА (640 x 320) ----------------
     phase 0/1 чередуются — "дышащая" неоновая подсветка бортов
     и мигающий стоп-огонь, как бегущие огни на киберпанк-тачке. */
  function carSVG(phase){
  const cyanOp    = phase === 0 ? 0.85 : 0.45;
  const magentaOp = phase === 0 ? 0.55 : 1.0;
  const tailOp    = phase === 0 ? 1.0  : 0.35;
  const headGlow  = phase === 0 ? 4    : 5.4;
  return `
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="vBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6a8f"/><stop offset=".45" stop-color="#28304a"/><stop offset="1" stop-color="#11141f"/>
    </linearGradient>
    <linearGradient id="vGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8f6ff"/><stop offset=".5" stop-color="#3fc7e8"/><stop offset="1" stop-color="#14566e"/>
    </linearGradient>
    <linearGradient id="vJet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef4ff" stop-opacity=".95"/><stop offset="1" stop-color="#7ef4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vJetP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff64d8" stop-opacity=".95"/><stop offset="1" stop-color="#ff64d8" stop-opacity="0"/>
    </linearGradient>
    <filter id="vGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- выхлоп двигателей вниз -->
  <path d="M168,214 L206,214 L222,308 L152,308 Z" fill="url(#vJet)"/>
  <path d="M428,214 L466,214 L482,308 L412,308 Z" fill="url(#vJetP)"/>

  <g stroke="#080c14" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- хвостовой киль -->
    <path d="M96,170 L60,110 L118,132 L130,178 Z" fill="#1a2030"/>

    <!-- корпус -->
    <path d="M62,182 C82,146 146,126 214,120 C286,114 366,112 434,122 C494,131 552,152 588,180
             C606,194 602,212 578,220 C520,236 416,246 320,246 C224,246 118,238 70,222
             C50,215 52,196 62,182 Z" fill="url(#vBody)"/>

    <!-- кабина -->
    <path d="M198,126 C232,82 300,66 372,74 C414,79 452,96 476,120 C404,108 262,108 198,126 Z" fill="url(#vGlass)"/>

    <!-- гондолы двигателей -->
    <path d="M150,196 C150,180 172,172 190,172 C210,172 224,182 224,198 C224,212 206,218 188,218 C168,218 150,210 150,196 Z" fill="#171c28"/>
    <path d="M410,196 C410,180 432,172 450,172 C470,172 484,182 484,198 C484,212 466,218 448,218 C428,218 410,210 410,196 Z" fill="#171c28"/>

    <!-- носовой обтекатель -->
    <path d="M540,158 C566,166 586,176 594,188 C572,196 548,198 526,194 Z" fill="#2b3450"/>
  </g>

  <!-- неоновая полоса по борту: магента и циан "дышат" по очереди -->
  <path d="M96,206 C200,224 420,228 566,200" fill="none" stroke="#ff3fc9" stroke-width="9" stroke-linecap="round" opacity="${magentaOp}" filter="url(#vGlow)"/>
  <path d="M110,160 C220,138 400,136 540,158" fill="none" stroke="#35eaff" stroke-width="5" stroke-linecap="round" opacity="${cyanOp}" filter="url(#vGlow)"/>

  <!-- блик на стекле -->
  <path d="M232,120 C268,90 322,80 372,84" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".55"/>

  <!-- фара + луч, слегка мерцает -->
  <circle cx="576" cy="184" r="${headGlow}" fill="#fff6c4" filter="url(#vGlow)"/>
  <path d="M588,172 L640,140 L640,232 L588,198 Z" fill="#ffe873" opacity=".22" filter="url(#vSoft)"/>

  <!-- сопла -->
  <ellipse cx="188" cy="216" rx="24" ry="9" fill="#7ef4ff" opacity="${cyanOp}" filter="url(#vGlow)"/>
  <ellipse cx="448" cy="216" rx="24" ry="9" fill="#ff64d8" opacity="${magentaOp}" filter="url(#vGlow)"/>

  <!-- стоп-огни сзади, мигают -->
  <rect x="64" y="186" width="26" height="10" rx="5" fill="#ff3b3b" opacity="${tailOp}" filter="url(#vGlow)"/>

  <!-- бортовой номер -->
  <g opacity=".9">
    <rect x="286" y="196" width="78" height="26" rx="6" fill="#0d1220" stroke="#35eaff" stroke-width="3"/>
    <text x="325" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8ef2ff">NEO-7</text>
  </g>
</svg>`;
  }

  const FRAMES_CAR = [ carSVG(0), carSVG(1) ];

  const SPRITE_FRAMES = {
    guy:    FRAMES_GUY,
    couple: FRAMES_COUPLE,
    car:    FRAMES_CAR
  };

  /* ==========================================================================
     ФЛИПБУК-АНИМАЦИЯ: у каждого спрайта несколько кадров-SVG (см. выше).
     Каждый кадр один раз рисуется в canvas, дальше просто переключаем,
     какой canvas показан — это дёшево и работает на любом Android/iOS,
     в отличие от прямой SVG-текстуры (которая на части устройств
     превращается в чёрный прямоугольник).
     SS — множитель разрешения текстуры (2 = чётче, но тяжелее).
     ========================================================================== */
  const SS = 2;

  function toDataURI(svg){
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.trim());
  }

  function loadImage(svg){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = toDataURI(svg);
    });
  }

  // готовит canvas-текстуру для спрайта и возвращает контроллер
  // с методом setFrame(i) для переключения кадра
  async function setupSprite(el, svgFrames){
    const m = svgFrames[0].match(/width="(\d+)" height="(\d+)"/);
    const w = m ? +m[1] : 512, h = m ? +m[2] : 512;

    let images;
    try {
      images = await Promise.all(svgFrames.map(loadImage));
    } catch (e) {
      document.getElementById('status').textContent = 'Спрайт не загрузился: ' + el.dataset.sprite;
      return null;
    }

    const canvas = document.createElement('canvas');
    canvas.width  = w * SS;
    canvas.height = h * SS;
    const ctx = canvas.getContext('2d');

    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = 4;
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else tex.encoding = THREE.sRGBEncoding;

    function setFrame(i){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(images[i], 0, 0, canvas.width, canvas.height);
      tex.needsUpdate = true;
    }
    setFrame(0);

    const put = () => {
      const mesh = el.getObject3D('mesh');
      if (!mesh) { el.addEventListener('loaded', put, { once: true }); return; }
      mesh.material = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        alphaTest: 0.01,
        side: THREE.DoubleSide,
        toneMapped: false,
        depthWrite: false
      });
      mesh.material.needsUpdate = true;
    };
    put();

    return { setFrame, frameCount: images.length };
  }

  // случайное, "живое" моргание — не в такт, каждый персонаж моргает
  // в своём ритме, кадр закрытых глаз держится коротко
  function scheduleBlink(ctrl, minDelay, maxDelay){
    if (!ctrl) return;
    const wait = minDelay + Math.random() * (maxDelay - minDelay);
    setTimeout(() => {
      ctrl.setFrame(1);
      setTimeout(() => {
        ctrl.setFrame(0);
        scheduleBlink(ctrl, minDelay, maxDelay);
      }, 130);
    }, wait);
  }

  (async () => {
    // ВАЖНО: спрайты дублируются на каждую из 5 целей (по 3 плоскости на
    // каждую — guy/couple/car), т.е. всего по 5 штук каждого типа.
    // Раньше querySelectorAll(...).forEach(el => els[name] = el) затирал
    // предыдущие элементы и текстуру получала только последняя плоскость
    // (цель №4) — остальные 4 цели оставались с opacity:0, т.е. "невидимками".
    // Теперь заводим текстуру КАЖДОЙ плоскости отдельно, группируя только
    // сами промисы для параллельной загрузки.
    const groups = { guy: [], couple: [], car: [] };
    document.querySelectorAll('[data-sprite]').forEach(el => {
      groups[el.dataset.sprite].push(el);
    });

    async function setupGroup(elList, frames, blinkRange){
      const ctrls = await Promise.all(elList.map(el => setupSprite(el, frames)));
      if (blinkRange) {
        ctrls.forEach(ctrl => scheduleBlink(ctrl, blinkRange[0], blinkRange[1]));
      }
      return ctrls;
    }

    const [, , carCtrls] = await Promise.all([
      setupGroup(groups.guy,    SPRITE_FRAMES.guy,    [2200, 4200]),
      setupGroup(groups.couple, SPRITE_FRAMES.couple, [2600, 4800]),
      setupGroup(groups.car,    SPRITE_FRAMES.car,    null)
    ]);

    // машина не моргает — у каждой копии свой ровный "бегущий" цикл подсветки
    carCtrls.forEach(carCtrl => {
      if (!carCtrl) return;
      let phase = 0;
      setInterval(() => { phase = 1 - phase; carCtrl.setFrame(phase); }, 550);
    });
  })();

  /* ---------- статус AR ---------- */
  const scene   = document.querySelector('a-scene');
  const targets = document.querySelectorAll('[mindar-image-target]'); // все 5 целей, не только первая
  const status  = document.getElementById('status');

  scene.addEventListener('loaded',  () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
  scene.addEventListener('arReady', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
  scene.addEventListener('arError', () => { status.textContent = 'Ошибка запуска AR.'; });

  targets.forEach(target => {
    target.addEventListener('targetFound', () => { status.textContent = 'Румбокс найден!'; });
    target.addEventListener('targetLost',  () => { status.textContent = 'Наведи снова на румбокс.'; });
  });
  </script>
