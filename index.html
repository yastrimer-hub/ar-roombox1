<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cyberpunk Roombox — AR</title>

  <!-- Ровно та же связка CDN, что в mindar_clean_test.html — она у тебя точно работает -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin:0; overflow:hidden; }
    #status {
      position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
      z-index:9999; padding:9px 14px; border-radius:12px;
      background:rgba(0,0,0,.58); color:#fff;
      font:14px Arial,sans-serif; text-align:center;
      pointer-events:none; max-width:90vw;
    }
  </style>
</head>

<body>
  <div id="status">Запускаю AR…</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="world" mindar-image-target="targetIndex: 0">

      <!-- ОБЯЗАТЕЛЬНЫЙ СВЕТ — без него standard-материалы будут чёрными -->
      <a-light type="ambient" color="#aab7d6" intensity="0.55"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.35" position="0.3 0.6 0.4"></a-light>

      <!-- =========================================================
           ЧЕЛОВЕК В ЗЕЛЁНОЙ ТОЛСТОВКЕ С КАПЮШОНОМ.
           Стоит, прислонив (опёршись) одну ногу на жёлтый автомат
           с напитками (слева от улицы).
           Координаты взяты из уже откалиброванного теста
           "смокер у автомата" — тот же принцип позы.
           ========================================================= -->

      <a-entity id="leaningGuy"
        position="-0.15 -0.44 0.055"
        rotation="0 0 0"
        scale="0.46 0.46 0.46">

        <!-- торс = толстовка, зелёный -->
        <a-cylinder
          position="0 0.28 0"
          radius="0.078"
          height="0.25"
          rotation="0 0 -7"
          color="#2f8f5b"
          material="shader: standard; roughness: .68">
        </a-cylinder>

        <!-- голова -->
        <a-sphere
          position="0.025 0.48 0"
          radius="0.065"
          color="#c88e6d"
          material="shader: standard; roughness: .68">
        </a-sphere>

        <!-- капюшон, накинут на голову и чуть на плечи -->
        <a-sphere
          position="0.02 0.495 -0.02"
          radius="0.075"
          color="#1f6e44"
          material="shader: standard; roughness: .8">
        </a-sphere>
        <a-cone
          position="0.02 0.40 -0.05"
          radius-bottom="0.09"
          radius-top="0.04"
          height="0.12"
          rotation="10 0 0"
          color="#1f6e44"
          material="shader: standard; roughness: .8">
        </a-cone>

        <!-- завязки капюшона -->
        <a-sphere position="-0.02 0.34 0.07" radius="0.008" color="#e9e9e9"></a-sphere>
        <a-sphere position="0.06 0.33 0.07" radius="0.008" color="#e9e9e9"></a-sphere>

        <!-- опорная нога (прямая, стоит на земле) -->
        <a-cylinder
          position="-0.035 0.08 0"
          radius="0.028"
          height="0.28"
          rotation="0 0 -2"
          color="#20242c"
          material="shader: standard; roughness: .72">
        </a-cylinder>

        <!-- вторая нога согнута и стоит стопой на жёлтом автомате -->
        <a-entity position="0.00 0.14 0" rotation="0 0 -54">
          <a-cylinder
            position="0 -0.105 0"
            radius="0.028"
            height="0.23"
            color="#20242c"
            material="shader: standard; roughness: .72">
          </a-cylinder>
          <a-box
            position="0 -0.225 0.015"
            width="0.105"
            height="0.055"
            depth="0.065"
            color="#111318"
            material="shader: standard; roughness: .8">
          </a-box>
        </a-entity>

        <!-- левая рука свисает -->
        <a-cylinder
          position="-0.09 0.28 0"
          radius="0.021"
          height="0.18"
          rotation="0 0 -15"
          color="#c88e6d">
        </a-cylinder>

        <!-- правая рука в кармане толстовки (согнута к телу) -->
        <a-cylinder
          position="0.10 0.24 0.02"
          radius="0.022"
          height="0.15"
          rotation="0 0 -60"
          color="#2f8f5b"
          material="shader: standard; roughness: .68">
        </a-cylinder>

      </a-entity>


      <!-- =========================================================
           ПАРА В ОБНИМКУ НА МОСТИКЕ (верхняя перекладина/балкон).
           Мужчина и женщина стоят рядом, руки друг у друга на плечах.
           Подстрой position, если мостик на твоём фото в другом месте:
           X — левее/правее, Y — выше/ниже, Z — ближе/дальше от камеры.
           ========================================================= -->

      <a-entity id="couple"
        position="0.0 0.04 0.05"
        rotation="0 0 0"
        scale="0.30 0.30 0.30">

        <!-- МУЖЧИНА (слева) -->
        <a-cylinder position="-0.06 0.11 0" radius="0.03" height="0.26"
          color="#22262e" material="shader: standard; roughness:.7"></a-cylinder>
        <a-cylinder position="-0.045 0.30 0" radius="0.075" height="0.23" rotation="0 0 4"
          color="#2c3444" material="shader: standard; roughness:.65"></a-cylinder>
        <a-sphere position="-0.045 0.475 0" radius="0.065"
          color="#c88e6d" material="shader: standard; roughness:.68"></a-sphere>
        <a-sphere position="-0.045 0.505 -0.015" radius="0.062"
          color="#20242c" material="shader: standard; roughness:.85"></a-sphere>

        <!-- ЖЕНЩИНА (справа), чуть ниже ростом -->
        <a-cone position="0.055 0.14 0" radius-bottom="0.075" radius-top="0.045" height="0.24"
  color="#a13d5e" material="shader: standard; roughness:.6"></a-cone>
<a-box position="-0.01 0.028 0.02" width="0.03" height="0.02" depth="0.05" color="#1a1c22"></a-box>
<a-box position="0.10 0.028 0.02" width="0.03" height="0.02" depth="0.05" color="#1a1c22"></a-box>
        <a-cylinder position="0.05 0.275 0" radius="0.068" height="0.20" rotation="0 0 -4"
          color="#a13d5e" material="shader: standard; roughness:.62"></a-cylinder>
        <a-sphere position="0.05 0.43 0" radius="0.06"
          color="#d1a17e" material="shader: standard; roughness:.68"></a-sphere>
        <!-- длинные волосы -->
        <a-sphere position="0.05 0.455 -0.02" radius="0.072"
          color="#3a2318" material="shader: standard; roughness:.85"></a-sphere>
        <a-cylinder position="0.05 0.36 -0.045" radius="0.045" height="0.16" rotation="12 0 0"
          color="#3a2318" material="shader: standard; roughness:.85"></a-cylinder>

        <!-- РУКИ В ОБНИМКУ: мужская рука через плечи женщины -->
        <a-cylinder position="0.01 0.34 0.02" radius="0.02" height="0.16" rotation="0 0 -70"
          color="#2c3444" material="shader: standard; roughness:.65"></a-cylinder>
        <!-- женская рука через спину мужчины -->
        <a-cylinder position="-0.01 0.32 -0.015" radius="0.019" height="0.15" rotation="0 0 68"
          color="#a13d5e" material="shader: standard; roughness:.62"></a-cylinder>

        <!-- свободные руки, опущены -->
        <a-cylinder position="-0.115 0.27 0" radius="0.019" height="0.16" rotation="0 0 -10"
          color="#c88e6d"></a-cylinder>
        <a-cylinder position="0.125 0.25 0" radius="0.018" height="0.15" rotation="0 0 8"
          color="#d1a17e"></a-cylinder>

      </a-entity>


      <!-- =========================================================
           МАШИНА — ПРОСТО ВИСИТ НАД ДОРОГОЙ, БЕЗ КОЛЁС.
           Неоновая подсветка снизу (циан + розовый).
           Лёгкое покачивание вверх-вниз.
           ========================================================= -->

      <a-entity id="hoverCar"
        position="0.13 0.10 0.18"
        rotation="0 0 0"
        scale="0.40 0.40 0.40"
        animation="
          property: position;
          from: 0.13 0.10 0.18;
          to: 0.13 0.14 0.18;
          dur: 1700;
          easing: easeInOutSine;
          direction: alternate;
          loop: true">

        <!-- основной корпус -->
        <a-box position="0 0 0" width="0.48" height="0.12" depth="0.26"
          color="#242833" material="shader: standard; metalness:.75; roughness:.22"></a-box>

        <!-- кабина -->
        <a-box position="0 0.10 -0.02" width="0.25" height="0.12" depth="0.17"
          color="#151922" material="shader: standard; metalness:.18; roughness:.18"></a-box>

        <!-- стекло -->
        <a-box position="0 0.105 0.07" width="0.20" height="0.06" depth="0.012"
          color="#55d9f2" material="shader: standard; transparent:true; opacity:.68; emissive:#135c70; emissiveIntensity:.8"></a-box>

        <!-- боковые двигатели (без колёс, просто корпуса) -->
        <a-cylinder position="-0.22 -0.055 0" radius="0.06" height="0.05" rotation="90 0 0"
          color="#171a21" material="shader: standard; metalness:.8; roughness:.3"></a-cylinder>
        <a-cylinder position="0.22 -0.055 0" radius="0.06" height="0.05" rotation="90 0 0"
          color="#171a21" material="shader: standard; metalness:.8; roughness:.3"></a-cylinder>

        <!-- неоновые гондолы -->
        <a-box position="-0.23 0.02 0.08" width="0.04" height="0.025" depth="0.10"
          color="#48e9ff" material="shader: standard; emissive:#28e5ff; emissiveIntensity:3"></a-box>
        <a-box position="0.23 0.02 0.08" width="0.04" height="0.025" depth="0.10"
          color="#ff4dcf" material="shader: standard; emissive:#ff2fc1; emissiveIntensity:3"></a-box>

        <!-- сопла, светятся вниз, будто держат машину в воздухе -->
        <a-cone position="-0.16 -0.075 -0.15" radius-bottom="0.032" radius-top="0.006" height="0.11" rotation="180 0 0"
          color="#39dfff" material="shader: standard; emissive:#22dfff; emissiveIntensity:3"></a-cone>
        <a-cone position="0.16 -0.075 -0.15" radius-bottom="0.032" radius-top="0.006" height="0.11" rotation="180 0 0"
          color="#ff50d1" material="shader: standard; emissive:#ff32c7; emissiveIntensity:3"></a-cone>

        <!-- фары -->
        <a-sphere position="-0.13 0.015 0.145" radius="0.022" color="#fff3b0"
          material="shader:standard; emissive:#ffe67d; emissiveIntensity:4"></a-sphere>
        <a-sphere position="0.13 0.015 0.145" radius="0.022" color="#fff3b0"
          material="shader:standard; emissive:#ffe67d; emissiveIntensity:4"></a-sphere>

        <!-- лёгкое неоновое "облако" подсветки под машиной, чтобы читалось, что она парит -->
        <a-plane position="0 -0.13 0" rotation="-90 0 0" width="0.5" height="0.3"
          material="shader: flat; color:#38dfff; transparent:true; opacity:.12"></a-plane>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const target = document.querySelector('[mindar-image-target]');
    const status = document.getElementById('status');

    scene.addEventListener('loaded', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
    scene.addEventListener('arReady', () => { status.textContent = 'Камера запущена. Наведи на румбокс.'; });
    target.addEventListener('targetFound', () => { status.textContent = 'Румбокс найден!'; });
    target.addEventListener('targetLost', () => { status.textContent = 'Наведи снова на румбокс.'; });
    scene.addEventListener('arError', () => { status.textContent = 'Ошибка запуска AR.'; });
  </script>
</body>
</html>
