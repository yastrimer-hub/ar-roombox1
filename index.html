<!doctype html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Future World — стабильный 3D AR</title>

  <!-- ЭТОТ БЛОК ОДИН В ОДИН КАК В РАБОЧЕМ mindar_clean_test.html -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <!-- ВАЖНО:
       Каркас сцены оставлен тем же, который уже доказал,
       что камера + новый targets.mind работают. -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="world" mindar-image-target="targetIndex: 0">

      <!-- =================================================
           3D МАШИНА
           Два куба + 4 объёмных колеса.
           Никаких a-image / SVG.
           ================================================= -->

      <a-entity
        id="car"
        position="0 -0.82 0.12"
        animation="property: position;
                   from: 0 -0.82 0.12;
                   to: 0 0.72 0.12;
                   dur: 5200;
                   easing: linear;
                   loop: true">

        <!-- кузов -->
        <a-box
          position="0 0.12 0"
          width="0.28"
          height="0.14"
          depth="0.46"
          color="#d8dce3"
          material="shader: standard; metalness: 0.65; roughness: 0.25">
        </a-box>

        <!-- салон -->
        <a-box
          position="0 0.23 -0.035"
          width="0.20"
          height="0.14"
          depth="0.22"
          color="#27313b"
          material="shader: standard; metalness: 0.15; roughness: 0.25">
        </a-box>

        <!-- капот -->
        <a-box
          position="0 0.18 0.18"
          width="0.24"
          height="0.06"
          depth="0.16"
          color="#bec3cc"
          material="shader: standard; metalness: 0.5; roughness: 0.28">
        </a-box>

        <!-- переднее стекло -->
        <a-box
          position="0 0.235 0.078"
          width="0.16"
          height="0.06"
          depth="0.015"
          color="#67b8dc"
          material="shader: standard; transparent: true; opacity: 0.75; roughness: 0.12">
        </a-box>

        <!-- четыре КОЛЕСА — настоящие цилиндры -->
        <a-cylinder
          position="-0.16 0.045 0.15"
          radius="0.06"
          height="0.035"
          rotation="90 0 0"
          color="#15171b"
          material="shader: standard; roughness: 0.82">
        </a-cylinder>

        <a-cylinder
          position="0.16 0.045 0.15"
          radius="0.06"
          height="0.035"
          rotation="90 0 0"
          color="#15171b"
          material="shader: standard; roughness: 0.82">
        </a-cylinder>

        <a-cylinder
          position="-0.16 0.045 -0.15"
          radius="0.06"
          height="0.035"
          rotation="90 0 0"
          color="#15171b"
          material="shader: standard; roughness: 0.82">
        </a-cylinder>

        <a-cylinder
          position="0.16 0.045 -0.15"
          radius="0.06"
          height="0.035"
          rotation="90 0 0"
          color="#15171b"
          material="shader: standard; roughness: 0.82">
        </a-cylinder>

        <!-- фары -->
        <a-sphere
          position="-0.08 0.15 0.245"
          radius="0.021"
          color="#fff1a5"
          material="shader: standard; emissive: #ffe77d; emissiveIntensity: 2">
        </a-sphere>

        <a-sphere
          position="0.08 0.15 0.245"
          radius="0.021"
          color="#fff1a5"
          material="shader: standard; emissive: #ffe77d; emissiveIntensity: 2">
        </a-sphere>

      </a-entity>


      <!-- =================================================
           ЧЕЛОВЕК 1 — полностью 3D
           ================================================= -->

      <a-entity
        id="person1"
        position="0.24 -0.50 0.14"
        scale="0.65 0.65 0.65"
        animation="property: position;
                   from: 0.24 -0.50 0.14;
                   to: 0.24 0.62 0.14;
                   dur: 7000;
                   easing: linear;
                   loop: true">

        <!-- голова -->
        <a-sphere
          position="0 0.40 0"
          radius="0.065"
          color="#c99170">
        </a-sphere>

        <!-- волосы -->
        <a-sphere
          position="0 0.425 -0.015"
          radius="0.066"
          color="#24252a">
        </a-sphere>

        <!-- тело -->
        <a-cylinder
          position="0 0.25 0"
          radius="0.075"
          height="0.22"
          color="#3178b6"
          material="shader: standard; roughness: 0.6">
        </a-cylinder>

        <!-- ноги -->
        <a-cylinder
          position="-0.038 0.08 0"
          radius="0.025"
          height="0.23"
          color="#272b33">
        </a-cylinder>

        <a-cylinder
          position="0.038 0.08 0"
          radius="0.025"
          height="0.23"
          color="#272b33">
        </a-cylinder>

        <!-- руки -->
        <a-cylinder
          position="-0.095 0.25 0"
          radius="0.021"
          height="0.17"
          rotation="0 0 25"
          color="#c99170">
        </a-cylinder>

        <a-cylinder
          position="0.095 0.25 0"
          radius="0.021"
          height="0.17"
          rotation="0 0 -25"
          color="#c99170">
        </a-cylinder>

      </a-entity>


      <!-- =================================================
           ЧЕЛОВЕК 2 — идёт навстречу
           ================================================= -->

      <a-entity
        id="person2"
        position="-0.24 0.58 0.14"
        scale="0.58 0.58 0.58"
        animation="property: position;
                   from: -0.24 0.58 0.14;
                   to: -0.24 -0.65 0.14;
                   dur: 7600;
                   easing: linear;
                   loop: true">

        <a-sphere
          position="0 0.40 0"
          radius="0.065"
          color="#ae7859">
        </a-sphere>

        <a-sphere
          position="0 0.425 -0.015"
          radius="0.066"
          color="#4b2c28">
        </a-sphere>

        <a-cylinder
          position="0 0.25 0"
          radius="0.075"
          height="0.22"
          color="#a53f61">
        </a-cylinder>

        <a-cylinder
          position="-0.038 0.08 0"
          radius="0.025"
          height="0.23"
          color="#303039">
        </a-cylinder>

        <a-cylinder
          position="0.038 0.08 0"
          radius="0.025"
          height="0.23"
          color="#303039">
        </a-cylinder>

        <a-cylinder
          position="-0.095 0.25 0"
          radius="0.021"
          height="0.17"
          rotation="0 0 -25"
          color="#ae7859">
        </a-cylinder>

        <a-cylinder
          position="0.095 0.25 0"
          radius="0.021"
          height="0.17"
          rotation="0 0 25"
          color="#ae7859">
        </a-cylinder>

      </a-entity>


      <!-- =================================================
           3D ФОНАРИ
           ================================================= -->

      <a-entity position="-0.43 0.05 0.16">

        <a-cylinder
          position="0 0.26 0"
          radius="0.014"
          height="0.52"
          color="#30343b">
        </a-cylinder>

        <a-sphere
          id="lamp1"
          position="0 0.55 0"
          radius="0.042"
          color="#62e5ff"
          material="shader: standard; emissive: #3bdcff; emissiveIntensity: 3">
        </a-sphere>

        <a-light
          id="lampLight1"
          type="point"
          position="0 0.55 0"
          color="#32d9ff"
          intensity="1.2"
          distance="1.1">
        </a-light>

      </a-entity>


      <a-entity position="0.43 0.22 0.16">

        <a-cylinder
          position="0 0.26 0"
          radius="0.014"
          height="0.52"
          color="#30343b">
        </a-cylinder>

        <a-sphere
          id="lamp2"
          position="0 0.55 0"
          radius="0.042"
          color="#ff71d7"
          material="shader: standard; emissive: #ff43ca; emissiveIntensity: 3">
        </a-sphere>

        <a-light
          id="lampLight2"
          type="point"
          position="0 0.55 0"
          color="#ff43ca"
          intensity="1.1"
          distance="1.1">
        </a-light>

      </a-entity>

    </a-entity>
  </a-scene>


  <script>
    const scene = document.querySelector('a-scene');

    scene.addEventListener('loaded', () => {
      console.log('A-Frame loaded');
    });

    scene.addEventListener('arReady', () => {
      console.log('MindAR camera ready');
    });

    const target = document.querySelector('[mindar-image-target]');

    target.addEventListener('targetFound', () => {
      console.log('TARGET FOUND');
    });

    target.addEventListener('targetLost', () => {
      console.log('TARGET LOST');
    });


    /*
      Очень мягкое мерцание фонарей.
      Это не влияет на запуск камеры.
    */
    const l1 = document.getElementById('lampLight1');
    const l2 = document.getElementById('lampLight2');

    setInterval(() => {
      l1.setAttribute('intensity', 0.75 + Math.random() * 0.8);
      l2.setAttribute('intensity', 0.70 + Math.random() * 0.9);
    }, 320);
  </script>

</body>
</html>
