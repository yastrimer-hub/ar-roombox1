<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roombox AR</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:sans-serif; }
    #loading { position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:#000; color:#fff; text-align:center; padding:24px; box-sizing:border-box; }
    #loading small { opacity:.7; max-width:340px; line-height:1.45; }
    #error { color:#ff7070; max-width:360px; line-height:1.45; display:none; }
    .a-enter-vr, .a-enter-ar { display:none !important; }
    a-scene { position:fixed !important; inset:0 !important; width:100% !important; height:100% !important; }
    #status { position:fixed; z-index:100000; left:12px; right:12px; bottom:14px; color:#fff; text-align:center; font-size:13px; text-shadow:0 0 5px #000; pointer-events:none; }
  </style>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <div id="loading">
    <strong>Подготавливаю AR…</strong>
    <small id="loadingText">Загружаю модуль распознавания MindAR.</small>
    <div id="error"></div>
  </div>
  <div id="status">Загрузка…</div>

<script>
(() => {
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');
  const error = document.getElementById('error');
  const status = document.getElementById('status');

  const sources = [
    'https://raw.githubusercontent.com/hiukim/mind-ar-js/1.2.5/dist/mindar-image-aframe.prod.js',
    'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js',
    'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js'
  ];

  function loadScript(url) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = url;
      s.onload = () => resolve(url);
      s.onerror = () => reject(new Error('Не удалось загрузить ' + url));
      document.head.appendChild(s);
    });
  }

  async function loadMindAR() {
    for (let i = 0; i < sources.length; i++) {
      loadingText.textContent = `Загружаю MindAR (${i + 1}/${sources.length})…`;
      try {
        const loaded = await loadScript(sources[i]);
        if (window.AFRAME && AFRAME.systems && AFRAME.systems['mindar-image-system']) {
          return loaded;
        }
      } catch (e) {
        console.warn(e.message);
      }
    }
    throw new Error('Модуль MindAR не загрузился. Вероятнее всего браузер/сеть блокирует CDN или GitHub Raw.');
  }

  function buildScene() {
    const scene = document.createElement('a-scene');
    scene.setAttribute('mindar-image', 'imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes; missTolerance: 5; filterMinCF: 0.001; filterBeta: 0.001;');
    scene.setAttribute('color-space', 'sRGB');
    scene.setAttribute('renderer', 'antialias: true; colorManagement: true; alpha: true');
    scene.setAttribute('vr-mode-ui', 'enabled: false');
    scene.setAttribute('device-orientation-permission-ui', 'enabled: false');

    scene.innerHTML = `
      <a-assets>
        <img id="car" src="./assets/car.svg" crossorigin="anonymous">
        <img id="person1" src="./assets/person.svg" crossorigin="anonymous">
        <img id="person2" src="./assets/person.svg" crossorigin="anonymous">
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-image id="carEntity" src="#car" position="-0.45 -0.35 0.02" rotation="-90 0 0" width="0.28" height="0.14" visible="false"
          animation="property: position; from: -0.45 -0.35 0.02; to: 0.45 -0.35 0.02; dur: 3500; easing: easeInOutSine; loop: true; dir: alternate"></a-image>
        <a-image id="person1Entity" src="#person1" position="-0.25 -0.05 0.02" rotation="-90 0 0" width="0.09" height="0.22" visible="false"></a-image>
        <a-image id="person2Entity" src="#person2" position="0.30 -0.05 0.02" rotation="-90 0 0" width="0.09" height="0.22" visible="false"></a-image>
      </a-entity>`;

    document.body.appendChild(scene);
    return scene;
  }

  loadMindAR().then((source) => {
    loadingText.textContent = 'MindAR загружен. Запускаю камеру…';
    status.textContent = 'Камера запускается…';
    const scene = buildScene();
    const target = scene.querySelector('#target');
    const objects = [scene.querySelector('#carEntity'), scene.querySelector('#person1Entity'), scene.querySelector('#person2Entity')];

    const setVisible = (v) => objects.forEach(o => o.setAttribute('visible', v));
    target.addEventListener('targetFound', () => { setVisible(true); status.textContent = 'Румбокс найден — AR работает'; });
    target.addEventListener('targetLost', () => { setVisible(false); status.textContent = 'Наведите камеру на фасад румбокса'; });
    scene.addEventListener('arReady', () => { status.textContent = 'Камера запущена — наведите на румбокс'; loading.style.display = 'none'; });
    scene.addEventListener('arError', () => { loading.style.display = 'flex'; error.style.display = 'block'; error.textContent = 'MindAR не смог запустить AR. Проверьте разрешение камеры.'; });
    scene.addEventListener('loaded', () => console.log('[A-Frame] loaded; MindAR source:', source));
  }).catch((e) => {
    status.textContent = 'Ошибка загрузки AR';
    loadingText.textContent = 'MindAR не был загружен.';
    error.style.display = 'block';
    error.textContent = e.message;
  });
})();
</script>
</body>
</html>
