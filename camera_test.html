<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Проверка камеры</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block}
#panel{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(90vw,520px);box-sizing:border-box;padding:16px;border-radius:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:10;text-align:center}
#status{margin-bottom:12px;line-height:1.4;font-size:15px;white-space:pre-line}
button{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}
#error{color:#ffb4b4;margin-top:10px;white-space:pre-wrap;word-break:break-word;font-size:13px}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<div id="panel"><div id="status">Камера ещё не запущена.</div><button id="start">Запустить камеру</button><div id="error"></div></div>
<script>
const video=document.getElementById('camera'), status=document.getElementById('status'), startButton=document.getElementById('start'), errorBox=document.getElementById('error');
function setStatus(t){status.textContent=t;}
async function startCamera(){
 errorBox.textContent=''; setStatus('Запрашиваю доступ к камере...');
 if(!window.isSecureContext){setStatus('Ошибка: страница не работает в безопасном контексте HTTPS.'); errorBox.textContent='Открой страницу через https://... (например, GitHub Pages).'; return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Ошибка: браузер не поддерживает доступ к камере.'); errorBox.textContent='navigator.mediaDevices.getUserMedia недоступен.'; return;}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream; await video.play(); const track=stream.getVideoTracks()[0], settings=track.getSettings();
  setStatus('КАМЕРА РАБОТАЕТ ✅\nТеперь ты должен видеть изображение с камеры.');
  errorBox.textContent='Камера: '+(settings.label||'доступна')+'\nРазрешение: '+(settings.width||'?')+' × '+(settings.height||'?');
 }catch(err){console.error(err); setStatus('Камеру запустить не удалось.'); errorBox.textContent='Ошибка: '+(err.name||'UnknownError')+'\n'+(err.message||'Без дополнительного описания.');}
}
startButton.addEventListener('click',startCamera);
</script>
</body>
</html>
