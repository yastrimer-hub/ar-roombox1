<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор QR для AR-ромбокса</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: sans-serif; background:#0a0a12; color:#eee; text-align:center; padding:30px 16px; }
  input { width:90%; max-width:420px; padding:10px; font-size:15px; border-radius:6px; border:1px solid #333; margin-bottom:14px; }
  button { padding:10px 20px; font-size:15px; border-radius:6px; border:2px solid #0ff; background:transparent; color:#0ff; cursor:pointer; }
  #qrcode { margin:24px auto; display:inline-block; background:#fff; padding:12px; border-radius:8px; }
  a { color:#0ff; }
</style>
</head>
<body>
  <h2>Генератор QR-кода</h2>
  <p>Вставь сюда адрес своей AR-страницы<br>(тот, что дал GitHub Pages, например<br><code>https://username.github.io/ar-roombox/</code>)</p>
  <input type="url" id="urlInput" placeholder="https://username.github.io/ar-roombox/">
  <br>
  <button onclick="makeQR()">Сделать QR</button>

  <div id="qrcode"></div>
  <p id="dl" style="display:none"><a id="dlLink" download="qr-roombox.png">Скачать QR как PNG</a></p>

  <script>
    let qrcode = null;
    function makeQR() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) { alert('Вставь ссылку'); return; }
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      qrcode = new QRCode(container, {
        text: url,
        width: 260,
        height: 260,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      setTimeout(() => {
        const canvas = container.querySelector('canvas');
        if (canvas) {
          document.getElementById('dlLink').href = canvas.toDataURL('image/png');
          document.getElementById('dl').style.display = 'block';
        }
      }, 200);
    }
  </script>
</body>
</html>
